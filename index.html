<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChemDash</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  /* Waiheke High School palette — matched to the WHS crest and the
     Money Together house style: parchment paper, navy brand, gold accent. */
  --paper:#ecdfc0;
  --surface:#fbf6e9;
  --surface-2:#ddcba2;
  --line:#7c6a44;
  --line-strong:#5c4d2f;
  --ink:#201a0d;
  --ink-soft:#3d3419;
  --muted:#5b5238;
  --brand-navy:#002066;
  --brand-navy-deep:#00112e;
  --brand-navy-line:#00112e;
  --navy:#002066;
  --navy-soft:#d1e6f6;
  --gold:#c5a059;
  --gold-text:#8b6508;
  --gold-soft:#f5ead2;
  --wine:#8c2415;
  --wine-soft:#f2d7ce;
  --good:#0f6b3f;
  --good-soft:#cdeadb;
  --excellence:#59327b;
  --excellence-soft:#ece1f3;
  --mod-thermo:#a8590c;--mod-thermo-soft:#f7e6d3;
  --mod-organic:#166a4f;--mod-organic-soft:#d7ede3;
  --mod-aqueous:#1d5c9c;--mod-aqueous-soft:#dbe9f5;
  --c-thermo:var(--mod-thermo);--c-organic:var(--mod-organic);--c-aqueous:var(--mod-aqueous);
  --pt-alkali:#f6d9d4;--pt-alkali-ink:#96331f;
  --pt-alkaline:#fbe8c9;--pt-alkaline-ink:#9c6a12;
  --pt-transition:#f6ecd4;--pt-transition-ink:#8a6a1f;
  --pt-post:#e3ded0;--pt-post-ink:#6b5c3a;
  --pt-metalloid:#dcece0;--pt-metalloid-ink:#2f7a52;
  --pt-nonmetal:#d8ecec;--pt-nonmetal-ink:#1f7a7a;
  --pt-halogen:#e8dcf2;--pt-halogen-ink:#6a3f96;
  --pt-noble:#dbe6f7;--pt-noble-ink:#2c5490;
  --pt-lanth:#f3dce6;--pt-lanth-ink:#93335f;
  --pt-actin:#e4dbe8;--pt-actin-ink:#5a4570;
  --shadow:rgba(27,20,10,.24);
  --focus:var(--navy);
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Manrope',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --shadow-sm:0 2px 0 var(--shadow);
  --shadow-md:0 3px 0 var(--shadow);
  --radius-sm:6px;--radius-md:7px;--radius-lg:8px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1510;--surface:#182619;--surface-2:#243423;
    --line:#63765c;--line-strong:#8ba382;--ink:#f4ecd6;--ink-soft:#d9d0b8;--muted:#adbca4;
    --navy:#8ec2ec;--navy-soft:#1b2c38;
    --brand-navy:#123a8f;--brand-navy-deep:#05173d;--brand-navy-line:#3d6fe0;
    --gold:#d4b378;--gold-text:#e8c98a;--gold-soft:#2c2410;
    --wine:#ec9280;--wine-soft:#331d16;--good:#8be9b8;--good-soft:#123322;
    --excellence:#bf98e1;--excellence-soft:#2c1f38;
    --mod-thermo:#f0b860;--mod-thermo-soft:#3a2a12;
    --mod-organic:#6adfb3;--mod-organic-soft:#123322;
    --mod-aqueous:#7fb8ee;--mod-aqueous-soft:#1b2c38;
    --pt-alkali:#3a1f18;--pt-alkali-ink:#e8a693;
    --pt-alkaline:#3a2c12;--pt-alkaline-ink:#e8c176;
    --pt-transition:#332c14;--pt-transition-ink:#e3c97e;
    --pt-post:#2e2a20;--pt-post-ink:#c9b98f;
    --pt-metalloid:#173328;--pt-metalloid-ink:#7fd4a8;
    --pt-nonmetal:#123333;--pt-nonmetal-ink:#7fd8d8;
    --pt-halogen:#2c2038;--pt-halogen-ink:#c9a8e8;
    --pt-noble:#1b2c40;--pt-noble-ink:#9dc3ee;
    --pt-lanth:#331d28;--pt-lanth-ink:#e8a8c4;
    --pt-actin:#282035;--pt-actin-ink:#c2b0d8;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0d1510;--surface:#182619;--surface-2:#243423;
  --line:#63765c;--line-strong:#8ba382;--ink:#f4ecd6;--ink-soft:#d9d0b8;--muted:#adbca4;
  --navy:#8ec2ec;--navy-soft:#1b2c38;
  --brand-navy:#123a8f;--brand-navy-deep:#05173d;--brand-navy-line:#3d6fe0;
  --gold:#d4b378;--gold-text:#e8c98a;--gold-soft:#2c2410;
  --wine:#ec9280;--wine-soft:#331d16;--good:#8be9b8;--good-soft:#123322;
  --excellence:#bf98e1;--excellence-soft:#2c1f38;
  --mod-thermo:#f0b860;--mod-thermo-soft:#3a2a12;
  --mod-organic:#6adfb3;--mod-organic-soft:#123322;
  --mod-aqueous:#7fb8ee;--mod-aqueous-soft:#1b2c38;
  --pt-alkali:#3a1f18;--pt-alkali-ink:#e8a693;
  --pt-alkaline:#3a2c12;--pt-alkaline-ink:#e8c176;
  --pt-transition:#332c14;--pt-transition-ink:#e3c97e;
  --pt-post:#2e2a20;--pt-post-ink:#c9b98f;
  --pt-metalloid:#173328;--pt-metalloid-ink:#7fd4a8;
  --pt-nonmetal:#123333;--pt-nonmetal-ink:#7fd8d8;
  --pt-halogen:#2c2038;--pt-halogen-ink:#c9a8e8;
  --pt-noble:#1b2c40;--pt-noble-ink:#9dc3ee;
  --pt-lanth:#331d28;--pt-lanth-ink:#e8a8c4;
  --pt-actin:#282035;--pt-actin-ink:#c2b0d8;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);font-weight:800;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--navy);color:#fff}
.shell{max-width:1180px;margin:0 auto;padding-inline:20px}
.font-mono-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kicker{font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.on-navy .kicker,.masthead .kicker{color:var(--gold)}
.paper-grid{
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);
  background-size:20px 20px;
}
.surface{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.surface-strong{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
.spine{border-left:5px solid var(--spine,var(--brand-navy));}
.hairline{border-top:1.5px dashed var(--line)}
.nav-pill{border-radius:6px;transition:background .15s ease,color .15s ease}
.nav-pill:hover{background:rgba(255,255,255,.14)}
.btn-ink{background:var(--brand-navy);color:#fff;border:1.5px solid var(--brand-navy-line);border-radius:6px;font-weight:700;transition:filter .12s ease,transform .12s ease}
.btn-ink:hover{filter:brightness(1.12)}
.btn-ink:active{transform:translateY(1px)}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:6px;font-weight:700}
.btn-outline:hover{border-color:var(--navy);color:var(--navy)}
.card-hover{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.card-hover:hover{transform:translateY(-2px);border-color:var(--navy)}
.progress-track{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--navy),var(--brand-navy-line))}
.answer-lines{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 29px;line-height:29px}
.choice{transition:.12s ease}
.choice.correct{background:var(--good-soft);border-color:var(--good)!important;color:var(--ink)}
.choice.wrong{background:var(--wine-soft);border-color:var(--wine)!important;color:var(--ink)}
.breadcrumb{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-family:var(--font-mono)}
.breadcrumb button:hover{color:var(--navy)}
.activity-tile{min-height:150px}
.scope-list li{position:relative;padding-left:1.15rem}
.scope-list li::before{content:"–";position:absolute;left:0;color:var(--muted);font-weight:700}
.data-table{width:100%;border-collapse:collapse;font-size:.86rem}
.data-table th{text-align:left;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:.55rem .7rem;border-bottom:1.5px solid var(--line-strong)}
.data-table td{padding:.55rem .7rem;border-bottom:1px solid var(--line)}
.data-table tr:last-child td{border-bottom:none}
.eq{font-family:var(--font-mono);font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.65rem .9rem;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(13,10,4,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px 18px}
.overlay-panel{width:min(760px,96vw);max-height:88vh;overflow:auto;background:var(--surface);border-radius:var(--radius-lg);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.float-btn{position:fixed;right:18px;bottom:18px;z-index:90;width:52px;height:52px;border-radius:999px;background:var(--brand-navy);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--shadow);border:2px solid rgba(255,255,255,.2);cursor:pointer}
.float-btn:hover{background:var(--brand-navy-deep)}
.float-menu{position:fixed;right:18px;bottom:78px;z-index:90;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 4px 0 var(--shadow);padding:8px;display:flex;flex-direction:column;gap:3px;min-width:210px}
.float-menu button{text-align:left;padding:.6rem .75rem;border-radius:7px;font-size:.85rem;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:.55rem}
.float-menu button:hover{background:var(--surface-2);color:var(--ink)}
.tab-btn{font-weight:700;font-size:.82rem;padding:.55rem .95rem;border-radius:6px;color:var(--muted)}
.tab-btn.active{background:var(--brand-navy);color:#fff}
.confbtn{width:26px;height:26px;border-radius:5px;border:1.5px solid var(--line);font-family:var(--font-mono);font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface)}
.confbtn.active{background:var(--brand-navy);border-color:var(--brand-navy);color:#fff}
.pt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pt-grid{display:grid;grid-template-columns:repeat(18,54px);grid-auto-rows:54px;gap:3px}
.pt-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;border:1.5px solid transparent;font-family:var(--font-mono);padding:2px;transition:transform .1s ease,box-shadow .1s ease}
.pt-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);z-index:2;position:relative}
.pt-cell.pt-active{outline:3px solid var(--focus);outline-offset:1px}
.pt-z{font-size:.55rem;align-self:flex-start;opacity:.75}
.pt-sym{font-size:1.05rem;font-weight:700;line-height:1.1}
.pt-mass{font-size:.5rem;opacity:.75}
.pt-swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
.pt-alkali{background:var(--pt-alkali);color:var(--pt-alkali-ink);border-color:var(--pt-alkali-ink)}
.pt-alkaline{background:var(--pt-alkaline);color:var(--pt-alkaline-ink);border-color:var(--pt-alkaline-ink)}
.pt-transition{background:var(--pt-transition);color:var(--pt-transition-ink);border-color:var(--pt-transition-ink)}
.pt-post{background:var(--pt-post);color:var(--pt-post-ink);border-color:var(--pt-post-ink)}
.pt-metalloid{background:var(--pt-metalloid);color:var(--pt-metalloid-ink);border-color:var(--pt-metalloid-ink)}
.pt-nonmetal{background:var(--pt-nonmetal);color:var(--pt-nonmetal-ink);border-color:var(--pt-nonmetal-ink)}
.pt-halogen{background:var(--pt-halogen);color:var(--pt-halogen-ink);border-color:var(--pt-halogen-ink)}
.pt-noble{background:var(--pt-noble);color:var(--pt-noble-ink);border-color:var(--pt-noble-ink)}
.pt-lanth{background:var(--pt-lanth);color:var(--pt-lanth-ink);border-color:var(--pt-lanth-ink)}
.pt-actin{background:var(--pt-actin);color:var(--pt-actin-ink);border-color:var(--pt-actin-ink)}
.pt-swatch.pt-alkali{background:var(--pt-alkali-ink)}
.pt-swatch.pt-alkaline{background:var(--pt-alkaline-ink)}
.pt-swatch.pt-transition{background:var(--pt-transition-ink)}
.pt-swatch.pt-post{background:var(--pt-post-ink)}
.pt-swatch.pt-metalloid{background:var(--pt-metalloid-ink)}
.pt-swatch.pt-nonmetal{background:var(--pt-nonmetal-ink)}
.pt-swatch.pt-halogen{background:var(--pt-halogen-ink)}
.pt-swatch.pt-noble{background:var(--pt-noble-ink)}
.pt-swatch.pt-lanth{background:var(--pt-lanth-ink)}
.pt-swatch.pt-actin{background:var(--pt-actin-ink)}
svg.diagram text{font-family:var(--font-mono);fill:var(--ink)}
.masthead{background:linear-gradient(135deg,var(--brand-navy) 0%,var(--brand-navy-deep) 100%);border-bottom:2px solid var(--brand-navy-line)}
.whs-crest{height:40px;width:auto;flex:none;display:block;background:#fff;border-radius:6px;padding:3px 6px}
.icon-btn{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;transition:background .15s ease}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.text-thermo-700,.text-thermo-600{color:var(--mod-thermo)}
.bg-thermo-50{background:var(--mod-thermo-soft)}
.border-thermo-100{border-color:var(--mod-thermo-soft)}
.border-thermo-200{border-color:var(--mod-thermo)}
.text-organic-700,.text-organic-600{color:var(--mod-organic)}
.bg-organic-50{background:var(--mod-organic-soft)}
.border-organic-100{border-color:var(--mod-organic-soft)}
.border-organic-200{border-color:var(--mod-organic)}
.text-aqueous-700,.text-aqueous-600{color:var(--mod-aqueous)}
.bg-aqueous-50{background:var(--mod-aqueous-soft)}
.border-aqueous-100{border-color:var(--mod-aqueous-soft)}
.border-aqueous-200{border-color:var(--mod-aqueous)}
.text-orange-700,.text-amber-700{color:var(--gold-text)}
.bg-amber-50{background:var(--gold-soft)}
.border-amber-200{border-color:var(--gold)}
.text-purple-700,.text-purple-800{color:var(--excellence)}
.bg-purple-50{background:var(--excellence-soft)}
.border-purple-200{border-color:var(--excellence)}
.text-indigo-700{color:var(--navy)}
.bg-indigo-50{background:var(--navy-soft)}
.border-indigo-200{border-color:var(--navy)}
.bg-blue-50{background:var(--navy-soft)}
.border-blue-200{border-color:var(--navy)}
.bg-red-50{background:var(--wine-soft)}
.border-red-200{border-color:var(--wine)}
.text-emerald-600{color:var(--good)}
@media (max-width:640px){.activity-tile{min-height:auto}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

<script>
"use strict";

/* =========================================================================
   ICONS — small hand-drawn line icons, no external icon library required
   (keeps the page fully self-contained; every stroke uses currentColor so
   it always matches surrounding text).
   ========================================================================= */
const ICONS = {
  flask: '<path d="M9 2.5v6.7L4.3 17.4A2.1 2.1 0 0 0 6.1 20.6h11.8a2.1 2.1 0 0 0 1.8-3.2L15 9.2V2.5"/><line x1="8.3" y1="2.5" x2="15.7" y2="2.5"/><line x1="7.3" y1="14.5" x2="16.7" y2="14.5"/>',
  flame: '<path d="M12 21.5c4.1 0 7.2-2.8 7.2-7 0-3.1-1.9-5.2-3.1-7.3-.3 2.1-1.5 3.1-2.5 2 .6-2.7-.4-5.2-3.2-7.5-.4 3.1-1.8 4.9-3.4 6.7C5.6 10.1 4.8 12.2 4.8 14.5c0 4.2 3.1 7 7.2 7Z"/>',
  hexagon: '<polygon points="12,3.2 19.8,7.6 19.8,16.4 12,20.8 4.2,16.4 4.2,7.6"/>',
  droplet: '<path d="M12 2.5s7.3 8.3 7.3 13A7.3 7.3 0 0 1 4.7 15.5C4.7 10.8 12 2.5 12 2.5Z"/>',
  doc: '<rect x="5" y="3" width="14" height="18" rx="1.6"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/>',
  checklist: '<rect x="4" y="3" width="16" height="18" rx="1.6"/><polyline points="7.3,8.2 8.4,9.3 10.6,7.1"/><line x1="12.6" y1="8.2" x2="16.6" y2="8.2"/><polyline points="7.3,13.2 8.4,14.3 10.6,12.1"/><line x1="12.6" y1="13.2" x2="16.6" y2="13.2"/><polyline points="7.3,18.2 8.4,19.3 10.6,17.1"/><line x1="12.6" y1="18.2" x2="16.6" y2="18.2"/>',
  pencil: '<path d="M4 20.2l.9-4 11-11 3.1 3.1-11 11-4 .9Z"/><line x1="13.5" y1="6.6" x2="17.6" y2="10.7"/>',
  blocks: '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
  chat: '<path d="M4 5h16v11.2H9.4L5 20V16.2H4Z"/>',
  shuffle: '<line x1="4" y1="7.5" x2="18.5" y2="7.5"/><polyline points="15,4 18.5,7.5 15,11"/><line x1="20" y1="16.5" x2="5.5" y2="16.5"/><polyline points="9,13 5.5,16.5 9,20"/>',
  filecheck: '<rect x="5" y="3" width="14" height="18" rx="1.6"/><polyline points="8.2,13 10.6,15.5 15.8,9.8"/>',
  target: '<circle cx="12" cy="12" r="8.3"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>',
  search: '<circle cx="10.3" cy="10.3" r="6.3"/><line x1="15" y1="15" x2="20" y2="20"/>',
  close: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
  back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="11,6 5,12 11,18"/>',
  checkcircle: '<circle cx="12" cy="12" r="9"/><polyline points="7.3,12.3 10.4,15.4 16.6,9"/>',
  ring: '<circle cx="12" cy="12" r="9"/>',
  info: '<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.3"/><circle cx="12" cy="7.4" r="1.1" fill="currentColor" stroke="none"/>',
  refresh: '<path d="M4.5 12a7.5 7.5 0 0 1 12.6-5.4"/><polyline points="17.5,3 17.5,7.5 13,7.5"/><path d="M19.5 12a7.5 7.5 0 0 1-12.6 5.4"/><polyline points="6.5,21 6.5,16.5 11,16.5"/>',
  theme: '<circle cx="12" cy="12" r="8.3"/><path d="M12 3.7a8.3 8.3 0 0 0 0 16.6Z" fill="currentColor" stroke="none"/>',
  externallink: '<path d="M14 4h6v6"/><line x1="20" y1="4" x2="11" y2="13"/><path d="M18 14v5.2A1.8 1.8 0 0 1 16.2 21H5.8A1.8 1.8 0 0 1 4 19.2V8.8A1.8 1.8 0 0 1 5.8 7H11"/>'
};
function icon(name,size=18,extraClass=""){
  const body=ICONS[name]||ICONS.ring;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="${extraClass}" style="flex:none" aria-hidden="true">${body}</svg>`;

  "summary":"Particle structure, periodic trends, shape and polarity, intermolecular forces, enthalpy, entropy and spontaneity.",
  "learn":[
    {"title":"Periodic trends","points":[
      "Effective nuclear charge is the pull the nucleus exerts on valence electrons once inner-shell shielding is accounted for.",
      "Across a period, protons increase while shielding stays roughly constant (same principal energy level) — effective nuclear charge increases.",
      "Greater effective nuclear charge pulls the valence electron cloud in tighter, so atomic radius generally decreases across a period.",
      "First ionisation energy generally increases across a period because more energy is needed to remove an electron held more tightly.",
      "Down a group, an added principal energy level increases both shielding and the electron's distance from the nucleus, so atomic radius increases and ionisation energy decreases despite the growing number of protons.",
      "Electronegativity (the pull an atom exerts on shared bonding electrons) follows the same across-period, down-group pattern as ionisation energy.",
      "A large jump between successive ionisation energies marks a change of principal energy level — this is evidence used to assign an element's group number.",
      "The concept of resonance, Hund's rule, and the stability of half-filled sublevels is explicitly excluded from the 2026 standard — you will not be asked to use it to justify small dips in the trend."
    ]},
    {"title":"Shapes and polarity","points":[
      "VSEPR: electron regions around a central atom (bonding pairs and lone pairs) repel and arrange themselves to be as far apart as possible.",
      "Lone pair – lone pair repulsion is strongest, then lone pair – bonding pair, then bonding pair – bonding pair repulsion is weakest.",
      "A lone pair compresses the bond angle below the ideal value for that electron geometry, for example NH<sub>3</sub> is 107 degrees and H<sub>2</sub>O is 104.5 degrees, both less than the ideal tetrahedral 109.5 degrees.",
      "Electron geometry depends only on the number of electron regions; molecular shape depends on how many of those regions are bonding pairs versus lone pairs.",
      "A bond is polar when there is a meaningful electronegativity difference between the two bonded atoms, giving a bond dipole.",
      "A molecule is polar overall only when it has polar bonds AND an asymmetric shape, so the bond dipoles do not cancel.",
      "Symmetric molecules with polar bonds — CO<sub>2</sub>, BF<sub>3</sub>, CCl<sub>4</sub> — are non-polar overall because their bond dipoles point in directions that cancel exactly.",
      "Always separate two ideas: bond polarity (a property of one bond) and molecular polarity (a property of the whole 3-D shape)."
    ]},
    {"title":"Intermolecular forces","points":[
      "London dispersion forces arise from temporary, instantaneous dipoles caused by electron movement, and act between all molecules.",
      "Dispersion forces get stronger as molar mass and surface area of contact increase — a large non-polar molecule can have stronger net attractions than a small polar one.",
      "Permanent dipole-dipole attractions occur between polar molecules, in addition to the dispersion forces already present.",
      "Hydrogen bonding is a stronger, special case of dipole-dipole attraction that requires H bonded directly to N, O or F, interacting with a lone pair on N, O or F on a neighbouring molecule.",
      "Do not confuse an intermolecular force with a covalent bond: boiling water breaks hydrogen bonds between H<sub>2</sub>O molecules, never the O–H covalent bonds inside a molecule.",
      "Stronger intermolecular attractions mean more energy is required to separate particles, which raises melting point, boiling point and viscosity, and lowers volatility.",
      "\"Like dissolves like\": polar solutes dissolve well in polar solvents through dipole-dipole or hydrogen bonding with the solvent; non-polar solutes dissolve well in non-polar solvents through dispersion forces."
    ]},
    {"title":"Thermochemistry, entropy and Gibbs energy","points":[
      "Breaking bonds always requires energy (endothermic); forming bonds always releases energy (exothermic).",
      "Calorimetry: q = mcΔT gives the heat transferred to (or from) a measured mass of water or solution.",
      "Convert to a molar quantity with n = m / M, then ΔrH° = −q / n — the negative sign means heat released by the reaction (q positive as absorbed by the water) corresponds to a negative, exothermic ΔrH°.",
      "Formation-enthalpy (Hess's Law) calculations use ΔrH° = ΣΔfH°(products) − ΣΔfH°(reactants).",
      "Entropy (S) measures the number of ways particles and energy can be arranged — it increases on melting, boiling, dissolving a solid, heating, or producing more moles of gas.",
      "Gibbs free energy links the two: ΔG = ΔH − TΔS. A reaction is spontaneous when ΔG is negative.",
      "Four sign combinations to know: ΔH negative with ΔS positive is spontaneous at every temperature; ΔH positive with ΔS negative is never spontaneous; ΔH negative with ΔS negative is spontaneous only at low temperature; ΔH positive with ΔS positive is spontaneous only at high temperature."
    ]}

    {"id": "91390-gibbs-rec-02", "standard": "91390", "topic": "thermo", "subtopic": "gibbs", "type": "match", "prompt": "Match the sign combination of ΔH and ΔS to when the reaction is spontaneous.", "pairs": [["ΔH negative, ΔS positive", "Spontaneous at all temperatures"], ["ΔH positive, ΔS negative", "Never spontaneous"], ["ΔH negative, ΔS negative", "Spontaneous at low temperature only"], ["ΔH positive, ΔS positive", "Spontaneous at high temperature only"]]},
    {"id": "91390-hbond-rec-new01", "standard": "91390", "topic": "imf", "subtopic": "hbond", "type": "choice", "prompt": "Which molecule cannot hydrogen bond to another molecule of itself, even though it contains a polar H–X bond?", "options": ["NH<sub>3</sub>", "H<sub>2</sub>O", "HCl", "HF"], "answer": 2, "why": "Hydrogen bonding requires H bonded directly to N, O or F. Chlorine does not qualify under this definition, so HCl relies only on weaker permanent dipole-dipole and dispersion forces between its own molecules."},
    {"id": "91390-hbond-rec-new02", "standard": "91390", "topic": "imf", "subtopic": "hbond", "type": "gap", "prompt": "In a hydrogen bond, the H atom bonded to N, O or F on one molecule is attracted to a ____ on N, O or F of a neighbouring molecule.", "options": ["lone pair", "extra proton", "delocalised electron", "neutron"], "answer": 0, "why": "Hydrogen bonding is an electrostatic attraction between the partially positive H and a lone pair of electrons on a highly electronegative N, O or F atom nearby."},
    {"id": "91390-hbond-rec-new03", "standard": "91390", "topic": "imf", "subtopic": "hbond", "type": "match", "prompt": "Match the substance to whether hydrogen bonding occurs between its own molecules.", "pairs": [["NH<sub>3</sub> molecules", "Hydrogen bonds via N–H···N"], ["H<sub>2</sub>O molecules", "Hydrogen bonds via O–H···O"], ["HF molecules", "Hydrogen bonds via F–H···F"], ["CH<sub>3</sub>F molecules", "No hydrogen bonding — H is not bonded to F"]]},
    {"id": "91390-hbond-rec-new04", "standard": "91390", "topic": "imf", "subtopic": "hbond", "type": "choice", "prompt": "Ethanol (CH<sub>3</sub>CH<sub>2</sub>OH) and dimethyl ether (CH<sub>3</sub>OCH<sub>3</sub>) are structural isomers with the same molecular formula. Which correctly explains why only ethanol's molecules hydrogen bond to each other?", "options": ["Ethanol has more carbon atoms", "Ethanol has an O–H bond, so H is bonded directly to O; every H in the ether is bonded to C", "Ethanol is denser", "Dimethyl ether contains no oxygen"], "answer": 1, "why": "Hydrogen bonding needs H bonded directly to N, O or F. In dimethyl ether every hydrogen is bonded to carbon, so it cannot hydrogen bond to itself even though it contains oxygen."},
    {"id": "91390-hbond-rec-new05", "standard": "91390", "topic": "imf", "subtopic": "hbond", "type": "gap", "prompt": "Compared with a molecule of similar size relying only on permanent dipole-dipole attractions, a molecule that can hydrogen bond will generally have a ____ boiling point.", "options": ["lower", "higher", "identical", "unpredictable"], "answer": 1, "why": "Hydrogen bonding is a stronger special case of dipole-dipole attraction, so more energy is needed to separate hydrogen-bonded molecules, raising the boiling point."},
    {"id": "91390-atomic-radius-rec-new2-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "type": "choice", "prompt": "Which pair is correctly ordered from largest to smallest atomic radius?", "options": ["Na, Mg, Al", "Al, Mg, Na", "Mg, Na, Al", "Al, Na, Mg"], "answer": 0, "why": "Across Period 3, nuclear charge increases while shielding stays similar, so atomic radius decreases from Na to Mg to Al."},
    {"id": "91390-atomic-radius-rec-new2-02", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "type": "gap", "prompt": "An anion is always ____ than the neutral atom it formed from.", "options": ["larger", "smaller", "exactly the same size", "impossible to compare"], "answer": 0, "why": "Adding one or more electrons increases electron-electron repulsion without adding a proton, so the electron cloud expands and the anion is larger than the neutral atom."},
    {"id": "91390-atomic-radius-rec-new2-03", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "type": "choice", "prompt": "Which of these species is isoelectronic with Ar (has the same number of electrons)?", "options": ["Cl<sup>-</sup>", "Na<sup>+</sup>", "K<sup>+</sup>", "All of these"], "answer": 3, "why": "Cl<sup>-</sup>, Na<sup>+</sup> and K<sup>+</sup> all have 18 electrons, the same as Ar, making all three isoelectronic with it."},
    {"id": "91390-atomic-radius-rec-new2-04", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "type": "match", "prompt": "Match the change to its effect on atomic/ionic radius.", "pairs": [["Across a period (left to right)", "Atomic radius decreases"], ["Down a group (top to bottom)", "Atomic radius increases"], ["Forming a cation", "Radius decreases"], ["Forming an anion", "Radius increases"]]}
  ],
  "build":[
    {"id": "91390-boiling-bld-01", "standard": "91390", "topic": "imf", "subtopic": "boiling", "stem": "Stronger intermolecular attractions leads to ____ leads to a higher boiling point.", "options": ["less energy required to separate particles", "more energy required to separate particles", "fewer electrons overall", "lower polarity"], "answer": 1, "why": "More thermal energy is needed to separate particles held together by stronger attractions, so boiling requires a higher temperature."},
    {"id": "91390-atomic-radius-bld-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "stem": "Greater nuclear charge with similar shielding leads to a stronger electrostatic attraction leads to ____.", "options": ["a larger atomic radius", "a smaller atomic radius", "more electron shells", "a lower nuclear charge"], "answer": 1, "why": "The valence electrons are pulled closer to the nucleus, shrinking the atom."},
    {"id": "91390-boiling-bld-02", "standard": "91390", "topic": "imf", "subtopic": "boiling", "stem": "More electrons and a greater surface area of contact leads to stronger London dispersion forces leads to ____.", "options": ["a lower boiling point", "a higher boiling point", "an ionic bond forming", "no change in state"], "answer": 1, "why": "Stronger dispersion forces require more energy to overcome, raising the boiling point."},
    {"id": "91390-polarity-bld-01", "standard": "91390", "topic": "shape", "subtopic": "polarity", "stem": "Polar bonds plus an asymmetric shape leads to bond dipoles not cancelling leads to ____.", "options": ["a non-polar molecule", "a polar molecule", "a chiral molecule", "an ionic compound"], "answer": 1, "why": "An asymmetric arrangement of polar bonds leaves a net molecular dipole, so the molecule is polar overall."},
    {"id": "91390-calorimetry-bld-01", "standard": "91390", "topic": "thermo", "subtopic": "calorimetry", "stem": "A reaction releases heat to the surrounding water leads to q being measured as positive leads to ____.", "options": ["ΔrH is reported as positive", "ΔrH is reported as negative", "ΔS must be zero", "no ΔrH can be calculated"], "answer": 1, "why": "ΔrH° = −q / n, so a positive q (heat absorbed by the water) gives a negative ΔrH°, confirming the reaction is exothermic."},
    {"id": "91390-entropy-bld-01", "standard": "91390", "topic": "thermo", "subtopic": "entropy", "stem": "A reaction produces more moles of gas than it started with leads to more ways to arrange particles leads to ____.", "options": ["ΔS is negative", "ΔS is positive", "ΔH becomes zero", "ΔG cannot be found"], "answer": 1, "why": "More gas particles moving independently means more possible arrangements, so entropy increases."},
    {"id": "91390-hbond-bld-new01", "standard": "91390", "topic": "imf", "subtopic": "hbond", "stem": "H is bonded directly to O in H<sub>2</sub>O leads to a lone pair on a neighbouring O is available leads to ____.", "options": ["a hydrogen bond forms between the two water molecules", "a new covalent bond forms between the two oxygen atoms", "the molecules repel permanently", "no attraction forms"], "answer": 0, "why": "This is exactly the hydrogen-bonding condition: H directly bonded to O, attracted to a lone pair on a neighbouring O."},
    {"id": "91390-hbond-bld-new02", "standard": "91390", "topic": "imf", "subtopic": "hbond", "stem": "Replacing the O–H bond in CH<sub>3</sub>OH with a C–H bond (as in ethane, CH<sub>3</sub>CH<sub>3</sub>) removes the H bonded directly to O leads to ____.", "options": ["hydrogen bonding is no longer possible between molecules", "the boiling point increases sharply", "the molecule becomes ionic", "dispersion forces disappear"], "answer": 0, "why": "Without an H atom bonded directly to O, N or F, hydrogen bonding cannot occur; only weaker dispersion forces remain between ethane molecules."},
    {"id": "91390-hbond-bld-new03", "standard": "91390", "topic": "imf", "subtopic": "hbond", "stem": "A molecule can hydrogen bond to others like itself leads to more thermal energy is needed to separate its molecules leads to ____.", "options": ["a lower melting and boiling point than a similar-sized molecule without hydrogen bonding", "a higher melting and boiling point than a similar-sized molecule without hydrogen bonding", "no effect on melting or boiling point", "immediate sublimation"], "answer": 1, "why": "Stronger intermolecular attraction from hydrogen bonding means more energy is required to separate particles, raising melting and boiling points."},
    {"id": "91390-hbond-bld-new04", "standard": "91390", "topic": "imf", "subtopic": "hbond", "stem": "Water forms an extensive hydrogen-bonded network throughout the liquid leads to unusually strong intermolecular attraction for such a small molecule leads to ____.", "options": ["an unusually high boiling point compared with non-polar molecules of similar or greater molar mass", "no effect compared to a non-polar molecule of the same size", "an unusually low boiling point", "the molecule becoming non-polar"], "answer": 0, "why": "Water's hydrogen-bond network gives it a boiling point far higher than non-polar molecules of similar or even much greater molar mass, a hallmark of hydrogen bonding's strength."},
    {"id": "91390-atomic-radius-bld-new2-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "stem": "Three isoelectronic species (same number of electrons) have different numbers of protons leads to the species with the most protons has the strongest pull on its fixed number of electrons leads to ____.", "options": ["that species has the largest radius", "that species has the smallest radius", "all three have identical radii", "the species becomes unstable"], "answer": 1, "why": "For isoelectronic species, more protons means a greater effective nuclear charge pulling on the same number of electrons, giving a smaller radius."},
    {"id": "91390-atomic-radius-bld-new2-02", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "stem": "A neutral atom loses an electron to form a cation leads to the remaining electrons are pulled in by the same nuclear charge acting on fewer electrons leads to ____.", "options": ["the cation is larger than the atom", "the cation is smaller than the atom", "no change in size occurs", "the nucleus loses a proton"], "answer": 1, "why": "Removing an electron reduces electron-electron repulsion and often removes an entire outer shell, so the cation is smaller than the neutral atom."},
    {"id": "91390-atomic-radius-bld-new2-03", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "stem": "Moving down a group adds a new occupied principal energy level leads to valence electrons sit further from the nucleus and experience more shielding leads to ____.", "options": ["atomic radius decreases despite more protons", "atomic radius increases despite more protons", "the nuclear charge becomes negative", "electronegativity increases sharply"], "answer": 1, "why": "The extra shell outweighs the increased nuclear charge, so atoms get larger going down a group even though they have more protons."}
  ],
  "explain":[
    {"id": "91390-atomic-radius-exp-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "question": "Explain why Cl has a smaller atomic radius than Na.", "criteria": ["greater nuclear charge", "similar shielding", "stronger electrostatic attraction", "electrons pulled closer"], "merit": "Cl has a greater nuclear charge than Na while the valence electrons are in the same principal energy level, so shielding is similar. The stronger attraction between the nucleus and valence electrons pulls the electrons closer, making Cl smaller.", "excellence": "Across Period 3, the number of protons increases from Na to Cl while the valence electrons remain in the third principal energy level and experience broadly similar shielding from inner-shell electrons. This increases the effective nuclear charge felt by the valence electrons, pulling the electron cloud closer to the nucleus. Because this effect strengthens steadily across the period, Cl has a smaller atomic radius than Na."},
    {"id": "91390-boiling-exp-01", "standard": "91390", "topic": "imf", "subtopic": "boiling", "question": "Explain why H<sub>2</sub>O has a much higher boiling point than H<sub>2</sub>S.", "criteria": ["hydrogen bonding in water", "dipole forces in H<sub>2</sub>S", "hydrogen bonds stronger", "more energy required", "higher boiling point"], "merit": "H<sub>2</sub>O molecules form hydrogen bonds, whereas H<sub>2</sub>S has weaker permanent dipole-dipole attractions. Because hydrogen bonding is stronger, more energy is needed to separate H<sub>2</sub>O molecules, so H<sub>2</sub>O has the higher boiling point.", "excellence": "H<sub>2</sub>O molecules form hydrogen bonds because H is directly bonded to the highly electronegative O. H<sub>2</sub>S is polar and has permanent dipole-dipole attractions, but these are weaker than hydrogen bonding. Because more thermal energy is required to overcome the stronger attractions between H<sub>2</sub>O molecules, a higher temperature is needed for boiling, so H<sub>2</sub>O has the much higher boiling point."},
    {"id": "91390-vsepr-exp-01", "standard": "91390", "topic": "shape", "subtopic": "vsepr", "question": "Explain why NH<sub>3</sub> has a bond angle smaller than the ideal tetrahedral angle of 109.5 degrees.", "criteria": ["lone pair present", "lone pair repulsion greater", "compresses the bond angle", "107 degrees"], "merit": "NH<sub>3</sub> has four electron regions around N, one of which is a lone pair. Lone pair – bonding pair repulsion is stronger than bonding pair – bonding pair repulsion, which pushes the N–H bonds closer together and compresses the angle.", "excellence": "Nitrogen in NH<sub>3</sub> has four electron regions — three bonding pairs and one lone pair — giving a tetrahedral electron geometry. Because lone pair – bonding pair repulsion is stronger than bonding pair – bonding pair repulsion, the lone pair pushes the three N–H bonds closer together than the ideal 109.5 degrees. The resulting trigonal pyramidal molecular shape has a measured bond angle of about 107 degrees, smaller than a molecule with no lone pairs on the central atom."},
    {"id": "91390-polarity-exp-01", "standard": "91390", "topic": "shape", "subtopic": "polarity", "question": "Explain why CO<sub>2</sub> is a non-polar molecule even though each C=O bond is polar.", "criteria": ["linear shape", "dipoles point opposite directions", "symmetric arrangement", "dipoles cancel", "net dipole is zero"], "merit": "CO<sub>2</sub> is linear, so the two equal and opposite C=O bond dipoles point in opposite directions and cancel out, leaving no overall molecular dipole.", "excellence": "Each C=O bond in CO<sub>2</sub> is polar because oxygen is more electronegative than carbon, creating a bond dipole pointing toward each oxygen. Because CO<sub>2</sub> has a linear shape with the two identical bond dipoles arranged directly opposite each other, the two dipoles are equal in size and opposite in direction, so they cancel exactly. The molecule therefore has no net dipole and is non-polar overall despite containing polar bonds."},
    {"id": "91390-gibbs-exp-01", "standard": "91390", "topic": "thermo", "subtopic": "gibbs", "question": "Using ΔG = ΔH − TΔS, explain why a reaction with a positive ΔH and a positive ΔS can become spontaneous at high temperature.", "criteria": ["TΔS term grows", "outweighs positive ΔH", "ΔG becomes negative", "spontaneous at high T"], "merit": "As temperature increases, the −TΔS term becomes more negative, since ΔS is positive. At a high enough temperature this term outweighs the positive ΔH, making ΔG negative and the reaction spontaneous.", "excellence": "In ΔG = ΔH − TΔS, a positive ΔH makes a positive contribution to ΔG at every temperature, while a positive ΔS makes the −TΔS term increasingly negative as T rises. At low temperature the positive ΔH term dominates and ΔG stays positive, so the reaction is non-spontaneous. As temperature increases, the magnitude of −TΔS eventually exceeds ΔH, so the sum ΔG becomes negative. The reaction therefore switches from non-spontaneous to spontaneous once temperature passes the value where ΔH equals TΔS."},
    {"id": "91390-ionisation-exp-01", "standard": "91390", "topic": "periodic", "subtopic": "ionisation", "question": "Explain why successive ionisation energies of an element can show a very large jump between two particular values.", "criteria": ["new principal energy level", "electron closer to nucleus", "less shielding", "much greater energy required"], "merit": "A large jump happens once all the valence electrons in the outer principal energy level have been removed. The next electron comes from a level much closer to the nucleus with far less shielding, so it requires far more energy to remove.", "excellence": "Each successive ionisation energy is larger than the last because removing an electron from an increasingly positive ion requires more energy. A very large jump occurs specifically when the next electron to be removed comes from a lower, inner principal energy level rather than the same outer level as the previous electrons. That inner electron is held much closer to the nucleus and experiences far less shielding from other electrons, so a much greater amount of energy is required to remove it. The position of this jump reveals how many valence electrons the atom originally had, which identifies its group in the periodic table."},
    {"id": "91390-hbond-exp-new01", "standard": "91390", "topic": "imf", "subtopic": "hbond", "question": "Explain why NH<sub>3</sub> can hydrogen bond to water molecules in an aqueous ammonia solution.", "criteria": ["H bonded directly to N in NH<sub>3</sub>", "lone pair on O in water", "H bonded directly to O in water", "lone pair on N in NH<sub>3</sub>"], "merit": "NH<sub>3</sub> has an N–H bond and H<sub>2</sub>O has an O–H bond, so hydrogen bonds can form using the lone pair on water's O attracting an N–H hydrogen, and the lone pair on ammonia's N attracting an O–H hydrogen.", "excellence": "In NH<sub>3</sub>, each N–H bond has hydrogen bonded directly to the electronegative nitrogen, and nitrogen also carries a lone pair. In H<sub>2</sub>O, each O–H bond similarly has hydrogen bonded directly to oxygen, which also carries lone pairs. Because both molecules satisfy the hydrogen-bonding requirement, a hydrogen bond can form in either direction: an N–H hydrogen on ammonia can be attracted to a lone pair on water's oxygen, and an O–H hydrogen on water can be attracted to the lone pair on ammonia's nitrogen. This is one reason ammonia is highly soluble in water — like dissolves like, and both substances can hydrogen bond with each other, not just with themselves."},
    {"id": "91390-hbond-exp-new02", "standard": "91390", "topic": "imf", "subtopic": "hbond", "question": "Explain why HF has a much higher boiling point than HCl, even though HCl is a larger, heavier molecule.", "criteria": ["H bonded directly to F in HF", "hydrogen bonding present in HF", "Cl is not N, O or F", "HCl relies on weaker forces"], "merit": "HF molecules hydrogen bond because H is bonded directly to F. HCl cannot hydrogen bond because Cl is not N, O or F, so HCl relies only on weaker permanent dipole-dipole and dispersion forces. Because hydrogen bonding is stronger, more energy is needed to separate HF molecules, giving HF the higher boiling point.", "excellence": "In HF, hydrogen is bonded directly to fluorine, one of the three elements (N, O, F) that allow true hydrogen bonding, so HF molecules hydrogen bond strongly to each other. Although HCl is polar and experiences permanent dipole-dipole attraction as well as dispersion forces, chlorine does not meet the criteria for hydrogen bonding. Because hydrogen bonds are stronger than dipole-dipole attractions, more thermal energy is required to separate HF molecules than HCl molecules, so HF has the higher boiling point even though HCl has the greater molar mass, which would otherwise favour stronger dispersion forces in HCl."},
    {"id": "91390-hbond-exp-new03", "standard": "91390", "topic": "imf", "subtopic": "hbond", "question": "A student claims that hydrogen bonding is a type of covalent bond because it involves a hydrogen atom. Explain why this claim is incorrect.", "criteria": ["hydrogen bond is intermolecular", "covalent bond is intramolecular", "no electrons are shared", "much weaker than a covalent bond"], "merit": "A hydrogen bond is an intermolecular force acting between separate molecules, not a covalent bond within a molecule. It is an electrostatic attraction between a slightly positive H and a lone pair on a neighbouring molecule, not a shared pair of electrons, and it is much weaker than a covalent bond.", "excellence": "A covalent bond is an intramolecular bond formed when two atoms share a pair of electrons, holding a molecule together. A hydrogen bond, by contrast, is an intermolecular force: an electrostatic attraction between a hydrogen atom covalently bonded to N, O or F on one molecule, and a lone pair of electrons on a N, O or F atom of a neighbouring molecule. No electrons are shared between the two molecules, and the attraction is considerably weaker than the covalent bond that creates the partial positive charge on the hydrogen in the first place. The student's claim confuses the covalent bond within a molecule with the much weaker intermolecular attraction between molecules."},
    {"id": "91390-hbond-exp-new04", "standard": "91390", "topic": "imf", "subtopic": "hbond", "question": "Water has a higher boiling point than ammonia, even though both can hydrogen bond and have similar molar mass. Suggest and explain one reason for this, using the idea of hydrogen-bonding capacity.", "criteria": ["both can hydrogen bond", "water has two O-H hydrogens and two lone pairs", "ammonia has three N-H hydrogens but only one lone pair", "water forms more hydrogen bonds per molecule"], "merit": "Both water and ammonia can hydrogen bond, but water has two O–H bonds and two lone pairs on oxygen, allowing each water molecule to take part in more hydrogen bonds than ammonia, which has three N–H bonds but only one lone pair on nitrogen. More hydrogen bonds per molecule in water means more energy is needed to separate water molecules, giving water the higher boiling point.", "excellence": "Each water molecule has two O–H hydrogens available to donate to hydrogen bonds and two lone pairs on oxygen available to accept them, so on average each water molecule can take part in close to four hydrogen bonds within the liquid. Ammonia has three N–H hydrogens available to donate, but nitrogen has only one lone pair to accept a hydrogen bond, which limits how many hydrogen bonds each ammonia molecule can actually form at once. Because water forms a more extensive hydrogen-bonded network per molecule than ammonia, significantly more thermal energy is required to break apart water's intermolecular attractions than ammonia's, which is why water boils at a much higher temperature than ammonia despite the two molecules having similar molar mass and both being capable of hydrogen bonding."},
    {"id": "91390-atomic-radius-exp-new2-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "question": "Explain why a potassium ion (K<sup>+</sup>) is smaller than a potassium atom (K).", "criteria": ["K<sup>+</sup> has lost its outer electron", "removes the entire 4th shell", "remaining electrons are in the 3rd shell, closer to the nucleus", "same nuclear charge, fewer electrons"], "merit": "K loses its single outer-shell (4th shell) electron to form K<sup>+</sup>. This removes the entire outer shell, leaving the remaining electrons in the 3rd shell, closer to the nucleus, so K<sup>+</sup> is considerably smaller than the K atom.", "excellence": "The neutral K atom has one electron in its 4th principal energy level, shielded from the nucleus by the full 3rd shell beneath it. Losing that single outer electron to form K<sup>+</sup> removes the entire 4th shell, so the ion's remaining electrons now occupy only the 3rd shell. These remaining electrons are held by the same 19-proton nuclear charge but are now closer to the nucleus, so they are pulled in more tightly. Both the loss of an entire shell and the increased effective attraction on the remaining electrons make K<sup>+</sup> substantially smaller than the neutral K atom."},
    {"id": "91390-atomic-radius-exp-new2-02", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "question": "Cl<sup>-</sup> and K<sup>+</sup> are isoelectronic (both have 18 electrons), but Cl<sup>-</sup> is larger than K<sup>+</sup>. Explain why.", "criteria": ["same number of electrons", "Cl has 17 protons, K has 19 protons", "K<sup>+</sup> has greater nuclear charge on same electrons", "greater nuclear charge pulls electrons closer"], "merit": "Cl<sup>-</sup> and K<sup>+</sup> both have 18 electrons, but Cl has only 17 protons while K has 19. Since K<sup>+</sup> has more protons acting on the same number of electrons, its nuclear charge pulls those electrons in more tightly, making K<sup>+</sup> smaller than Cl<sup>-</sup>.", "excellence": "Cl<sup>-</sup> and K<sup>+</sup> are isoelectronic, each with 18 electrons in the same electron arrangement, so the difference in their size must come from their different nuclear charges. Chlorine has 17 protons, while potassium has 19, so K<sup>+</sup> has a greater effective nuclear charge acting on the same number of electrons. This stronger pull draws the electron cloud in K<sup>+</sup> closer to its nucleus than in Cl<sup>-</sup>, so despite having identical electron counts, K<sup>+</sup> has the smaller radius and Cl<sup>-</sup> the larger one. Comparing isoelectronic species like this isolates the effect of nuclear charge alone, since the number and arrangement of electrons is held constant."},
    {"id": "91390-atomic-radius-exp-new2-03", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "question": "Explain why atomic radius decreases across Period 3 (Na to Ar) but then increases sharply from Ar to K.", "criteria": ["across period: same shell, increasing nuclear charge", "radius decreases across the period", "Ar to K: new principal energy level begins", "new shell is further out, radius increases sharply"], "merit": "Across Period 3, each successive element adds a proton and an electron to the same 3rd shell, so nuclear charge increases while shielding stays similar, steadily pulling the electron cloud in and decreasing radius. Potassium's next electron starts a new, 4th principal energy level, which is further from the nucleus, so radius increases sharply from Ar to K.", "excellence": "Across Period 3, from Na to Ar, each element's additional proton and valence electron are added to the same third principal energy level, so shielding from inner electrons stays roughly constant while nuclear charge steadily increases. This growing effective nuclear charge pulls the existing electron shell in progressively tighter, so atomic radius decreases smoothly across the period. However, argon's electron configuration completely fills the third shell's available s and p sublevels, so potassium's 19th electron cannot be added to that shell and must instead begin a new fourth principal energy level. This new shell is both further from the nucleus and shielded by the entire filled third shell beneath it, so despite potassium having two more protons than argon, its outermost electron is much less strongly held, producing a sharp increase in atomic radius from Ar to K rather than a continued decrease."}
  ],
  "apply":[
    {"id": "91390-atomic-radius-app-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "question": "Mg<sup>2+</sup> is smaller than a neutral Mg atom. Explain why, applying periodic trend reasoning to an ion rather than an atom.", "answer": "Removing two electrons from Mg leaves the remaining electrons in a lower principal energy level, closer to the nucleus, with the same nuclear charge now acting on fewer electrons. This increases the effective nuclear charge felt by each remaining electron and removes an entire outer shell, so Mg<sup>2+</sup> has a substantially smaller radius than the Mg atom."},
    {"id": "91390-hbond-app-01", "standard": "91390", "topic": "imf", "subtopic": "hbond", "question": "CH<sub>3</sub>OCH<sub>3</sub> (dimethyl ether) and C<sub>2</sub>H<sub>5</sub>OH (ethanol) share the molecular formula C<sub>2</sub>H<sub>6</sub>O. Predict and justify which has the higher boiling point.", "answer": "Ethanol has the higher boiling point. Its O–H bond allows ethanol molecules to hydrogen bond to each other, while dimethyl ether has no H bonded directly to O, N or F, so it relies only on weaker permanent dipole-dipole and dispersion forces. More energy is required to separate hydrogen-bonded ethanol molecules, giving it the higher boiling point."},
    {"id": "91390-gibbs-app-01", "standard": "91390", "topic": "thermo", "subtopic": "gibbs", "question": "A reaction has ΔH = +120 kJ mol⁻¹ and ΔS = +150 J K⁻¹ mol⁻¹. Estimate the temperature above which the reaction becomes spontaneous, and explain your reasoning.", "answer": "The reaction becomes spontaneous once ΔG = 0, that is when ΔH = TΔS. Converting ΔS to kJ (0.150 kJ K⁻¹ mol⁻¹) and rearranging, T = ΔH / ΔS = 120 / 0.150 = 800 K. Above 800 K the −TΔS term outweighs the positive ΔH, ΔG becomes negative, and the reaction is spontaneous."},
    {"id": "91390-ionisation-app-01", "standard": "91390", "topic": "periodic", "subtopic": "ionisation", "question": "Two Period 3 elements have the electron configurations [Ne]3s<sup>2</sup> and [Ne]3s<sup>2</sup> 3p<sup>4</sup>. Predict, with reasoning, which has the larger first ionisation energy.", "answer": "[Ne]3s<sup>2</sup> 3p<sup>4</sup> (sulfur) has the larger first ionisation energy of the two, because it has more protons and a greater effective nuclear charge while the outer electrons are still shielded by the same inner core, so its valence electrons are held more tightly overall than in the element with fewer protons."},
    {"id": "91390-hbond-app-02", "standard": "91390", "topic": "imf", "subtopic": "hbond", "question": "A student mixes two liquids and finds they do not dissolve into a single layer. One liquid is water and the other is hexane (a non-polar hydrocarbon). Explain this observation in terms of intermolecular forces.", "answer": "Water molecules attract each other strongly through hydrogen bonding, while hexane molecules attract each other only through weak London dispersion forces. For hexane to dissolve, water's strong hydrogen bonds would need to be broken and replaced only by weak dispersion forces with hexane, which is energetically unfavourable. The two liquids therefore stay as separate layers rather than mixing — like dissolves like."},
    {"id": "91390-hbond-app-new01", "standard": "91390", "topic": "imf", "subtopic": "hbond", "question": "A new sunscreen ingredient, molecule X, has the structural formula CH<sub>3</sub>-O-CH<sub>2</sub>-CH<sub>2</sub>-O-CH<sub>3</sub> (an ether with no O–H bonds). Molecule Y, of similar molar mass, is HO-CH<sub>2</sub>-CH<sub>2</sub>-CH<sub>2</sub>-OH (a diol with two O–H bonds). Predict, with reasoning, which has the higher boiling point.", "answer": "Molecule Y has the higher boiling point. Its two O–H bonds mean hydrogen is bonded directly to oxygen at two positions, so Y molecules can hydrogen bond to each other, and can even form more hydrogen bonds per molecule than a simple alcohol. Molecule X has all its hydrogens bonded to carbon, so despite containing oxygen atoms, it cannot hydrogen bond between its own molecules and relies only on weaker permanent dipole-dipole and dispersion forces. Because more energy is required to separate hydrogen-bonded Y molecules, Y has the higher boiling point."},
    {"id": "91390-atomic-radius-app-new2-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "question": "A newly discovered element, 'Element X', is placed directly below caesium (Cs) in Group 1 on an extended periodic table. Predict, with reasoning, how its atomic radius would compare with caesium's.", "answer": "Element X would have a larger atomic radius than caesium. Moving down a group adds a new occupied principal energy level, which increases both the distance of the valence electron from the nucleus and the amount of inner-shell shielding, outweighing the increase in nuclear charge. Since Element X is directly below Cs in the same group, this same trend applies, giving Element X the larger radius of the two."},
    {"id": "91390-atomic-radius-app-new2-02", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "question": "Three ions — S<sup>2-</sup>, Cl<sup>-</sup> and K<sup>+</sup> — are all isoelectronic with Ar (18 electrons each). Rank them from largest to smallest radius and justify your ranking using proton number.", "answer": "From largest to smallest: S<sup>2-</sup> > Cl<sup>-</sup> > K<sup>+</sup>. All three have the identical electron arrangement (18 electrons), so the deciding factor is nuclear charge: S has 16 protons, Cl has 17, and K has 19. The fewest protons (S) gives the weakest pull on the shared number of electrons and therefore the largest radius, while the most protons (K) gives the strongest pull and the smallest radius."}
  ],
  "worked":[
    {"id": "91390-calorimetry-wrk-01", "standard": "91390", "topic": "thermo", "subtopic": "calorimetry", "title": "Calorimetry to molar enthalpy", "question": "Burning 0.0100 mol of a fuel underneath 50.0 g of water raises its temperature from 20.0°C to 45.0°C. Calculate the molar enthalpy of combustion.", "plan": ["Calculate q using q = mcΔT.", "Convert q to kJ.", "Divide by moles and apply the sign convention with ΔrH° = −q / n.", "State the answer with correct sign and units."], "answer": "q = mcΔT = 50.0 × 4.18 × 25.0 = 5225 J = 5.225 kJ. ΔrH° = −q / n = −5.225 / 0.0100 = −522.5 kJ mol⁻¹. The molar enthalpy of combustion is −522.5 kJ mol⁻¹ (exothermic).", "why": "This is Excellence-targeted because it uses the correct calorimetry equation, correctly converts units and moles, and applies the negative sign to show the reaction is exothermic.", "trap": "Forgetting the negative sign in ΔrH° = −q / n, or forgetting to convert joules to kilojoules."},
    {"id": "91390-boiling-wrk-01", "standard": "91390", "topic": "imf", "subtopic": "boiling", "title": "Boiling point: H<sub>2</sub>O vs H<sub>2</sub>S", "question": "Justify why H<sub>2</sub>O has a much higher boiling point than H<sub>2</sub>S.", "plan": ["Identify the intermolecular forces in both substances.", "Compare their strengths.", "Link strength to energy required.", "Link energy to boiling point."], "answer": "H<sub>2</sub>O molecules form hydrogen bonds because H is directly bonded to O. H<sub>2</sub>S is polar and experiences permanent dipole-dipole attractions as well as London forces, but not significant hydrogen bonding. Hydrogen bonds are stronger, so more thermal energy is required to separate H<sub>2</sub>O molecules. Therefore H<sub>2</sub>O has the higher boiling point.", "why": "This is Excellence-targeted because it integrates structure, force type, relative strength, energy and the observed property in one causal chain.", "trap": "Do not say boiling breaks O–H covalent bonds."},
    {"id": "91390-formation-wrk-01", "standard": "91390", "topic": "thermo", "subtopic": "formation", "title": "Enthalpy from formation data", "question": "If ΣΔfH°(products) = −890 kJ mol⁻¹ and ΣΔfH°(reactants) = −750 kJ mol⁻¹, calculate ΔrH° and interpret it.", "plan": ["Write ΔrH° = products − reactants.", "Substitute with signs.", "Calculate.", "Interpret the sign."], "answer": "ΔrH° = (−890) − (−750) = −140 kJ mol⁻¹. The negative value means the reaction is exothermic: 140 kJ mol⁻¹ is released under the stated conditions.", "why": "A strong response combines correct working, units and chemical interpretation.", "trap": "Subtracting a negative value is a common arithmetic error."},
    {"id": "91390-ionisation-wrk-01", "standard": "91390", "topic": "periodic", "subtopic": "ionisation", "title": "Reading successive ionisation energies", "question": "An element has successive ionisation energies (in kJ mol⁻¹) of 738, 1451, 7733, 10540. Identify which group of the periodic table this element belongs to and justify your answer.", "plan": ["Look for the position of the largest relative jump.", "Count how many ionisation energies came before that jump.", "Link that count to the number of valence electrons.", "State the group."], "answer": "The huge jump occurs between the 2nd (1451) and 3rd (7733) ionisation energies — more than five times larger than the previous step. This shows that only two electrons were removed relatively easily from the outer principal energy level before the third electron had to be removed from a much more tightly held inner level. Two valence electrons place this element in Group 2.", "why": "The response links a numerical pattern to electron configuration and then to periodic table position, which is the reasoning chain examiners look for.", "trap": "Picking the largest absolute difference in kJ mol⁻¹ instead of the largest relative (ratio) jump can sometimes mislead — always check which step is proportionally largest."},
    {"id": "91390-hbond-wrk-new01", "standard": "91390", "topic": "imf", "subtopic": "hbond", "title": "Comparing HF and HCl boiling points", "question": "HF boils at 19.5°C while HCl boils at –85°C, even though HCl has a greater molar mass. Explain this difference.", "plan": ["Identify the intermolecular forces present in each substance.", "Check whether each meets the hydrogen-bonding requirement (H bonded to N, O or F).", "Compare the relative strength of the dominant force in each.", "Link force strength to the energy needed to boil, and then to the boiling point."], "answer": "HF molecules have H bonded directly to F, so they hydrogen bond to each other. HCl is polar (Cl is more electronegative than H) so HCl molecules experience permanent dipole-dipole attraction and dispersion forces, but chlorine does not meet the N, O or F requirement for hydrogen bonding. Hydrogen bonding is a stronger attraction than the dipole-dipole and dispersion forces present in HCl, so considerably more thermal energy is required to separate HF molecules than HCl molecules. This is why HF has the higher boiling point despite HCl's greater molar mass, which would otherwise be expected to increase dispersion forces.", "why": "This is Excellence-targeted because it correctly identifies the dominant force in each substance, applies the exact hydrogen-bonding criterion rather than a vague 'more polar' argument, and explicitly overrides the expectation from molar mass alone.", "trap": "Do not assume the heavier molecule always has the higher boiling point — the type of intermolecular force present matters more than molar mass when hydrogen bonding is involved."},
    {"id": "91390-hbond-wrk-new02", "standard": "91390", "topic": "imf", "subtopic": "hbond", "title": "Identifying hydrogen bonding from a structural formula", "question": "Given the structural formulas of propan-1-ol (CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>OH) and methoxyethane (CH<sub>3</sub>OCH<sub>2</sub>CH<sub>3</sub>), both C<sub>3</sub>H<sub>8</sub>O isomers, identify which can hydrogen bond between its own molecules and justify your answer using their structures.", "plan": ["Locate every H atom in each structure.", "Check which, if any, H atoms are bonded directly to N, O or F.", "State whether the hydrogen-bonding requirement is met for each molecule.", "Conclude which liquid has the higher boiling point."], "answer": "Propan-1-ol has an O–H bond, so one of its hydrogen atoms is bonded directly to oxygen; this satisfies the requirement for hydrogen bonding, so propan-1-ol molecules hydrogen bond to each other. In methoxyethane, all hydrogen atoms are bonded to carbon atoms; none is bonded directly to the oxygen, so methoxyethane cannot hydrogen bond between its own molecules and relies only on weaker dipole-dipole and dispersion forces. Propan-1-ol therefore has the higher boiling point of the two isomers.", "why": "This response works directly from the structural formula rather than just the molecular formula, which is exactly the skill Excellence answers require when isomers are involved.", "trap": "Two compounds can share a molecular formula (both C<sub>3</sub>H<sub>8</sub>O here) but behave completely differently — always check the structural formula for exactly which atom each hydrogen is bonded to."},
    {"id": "91390-atomic-radius-wrk-new2-01", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "title": "Explaining an isoelectronic radius trend", "question": "Na<sup>+</sup>, Mg<sup>2+</sup> and Al<sup>3+</sup> are all isoelectronic with Ne (10 electrons each). Explain why Al<sup>3+</sup> has the smallest radius of the three.", "plan": ["Confirm all three species have the same number of electrons.", "Identify how many protons each one has.", "Link proton number to nuclear charge acting on the shared electron count.", "State which species is pulled in most tightly."], "answer": "Na<sup>+</sup>, Mg<sup>2+</sup> and Al<sup>3+</sup> are isoelectronic, each with 10 electrons in the same arrangement as neon. Na has 11 protons, Mg has 12, and Al has 13, so Al<sup>3+</sup> has the greatest nuclear charge of the three acting on the same fixed number of electrons. This strongest effective nuclear charge pulls Al<sup>3+</sup>'s electron cloud in more tightly than in Na<sup>+</sup> or Mg<sup>2+</sup>, giving Al<sup>3+</sup> the smallest radius of the three isoelectronic ions.", "why": "This is Excellence-targeted because it explicitly uses the isoelectronic principle (same electrons, different protons) to isolate and explain the cause of the radius difference, rather than just stating the trend.", "trap": "Do not compare these three using the normal period/group trend directly — they are ions with equal electron counts, so the comparison must be made through nuclear charge alone, exactly as with any isoelectronic series."},
    {"id": "91390-atomic-radius-wrk-new2-02", "standard": "91390", "topic": "periodic", "subtopic": "atomic-radius", "title": "Combining period and group trends", "question": "Without a periodic table in front of you, explain how you would predict whether phosphorus (P, Period 3, Group 15) or arsenic (As, Period 4, Group 15) has the larger atomic radius.", "plan": ["Identify the trend that applies when moving down a group.", "Note that P and As are in the same group.", "Apply the down-a-group reasoning.", "State the conclusion."], "answer": "P and As are in the same group (15), so the relevant trend is the down-a-group trend, not the across-a-period trend. Moving down a group adds a new occupied principal energy level, increasing both the electron's distance from the nucleus and the shielding from inner shells, which outweighs the higher nuclear charge. Since As is one period below P in the same group, As has the larger atomic radius of the two.", "why": "This response correctly identifies which trend applies (group, not period) before reasoning through it, which is the key decision this type of question is testing.", "trap": "Do not default to 'more protons means smaller radius' — that only applies when comparing elements in the same period. Down a group, more protons still comes with a larger radius because of the added shell."}
  ],

"91391": {
  "id":"91391","title":"Organic Chemistry","icon":"hexagon","colour":"organic",
  "summary":"Functional groups, reactions, reagents and conditions, isomerism, synthesis and organic reasoning.",
  "learn":[
    {"title":"Functional groups and isomerism","points":[
      "Level 2 knowledge of alkanes, alkenes, haloalkanes, alcohols, aldehydes, ketones, carboxylic acids and esters is assumed going into this standard.",
      "Structural isomers share the same molecular formula but a different structural formula — the atoms are connected differently.",
      "Geometric (cis/trans) isomerism needs restricted rotation around a C=C double bond, with two different groups attached to each carbon of that bond.",
      "A chiral carbon is bonded to four different groups. Enantiomers are the two non-superimposable mirror-image arrangements this allows.",
      "Enantiomers have identical physical properties except that they rotate plane-polarised light by equal amounts in opposite directions — this is detected with a polarimeter.",
      "Primary, secondary and tertiary alcohols are classified by how many carbon groups are attached to the carbon bearing the OH group, and this classification predicts how each one oxidises.",
      "Amine systematic naming for this standard is restricted to primary amines; you are not expected to recall the common names of amino acids."
    ]},
    {"title":"Organic reaction families","points":[
      "Alkenes undergo addition reactions across the C=C double bond, for example with H<sub>2</sub>, a halogen, or a hydrogen halide.",
      "Haloalkanes can undergo substitution (the halogen is replaced) or elimination (a haloalkane forms an alkene), depending on the reagent and conditions used.",
      "Primary alcohols oxidise first to an aldehyde, then further to a carboxylic acid; secondary alcohols oxidise only as far as a ketone; tertiary alcohols resist oxidation because there is no H on the carbon bearing the OH group for the oxidising agent to remove.",
      "A common oxidising agent such as acidified potassium dichromate changes colour (orange to green) as the oxidation occurs — a useful observation to describe in an answer.",
      "Reduction reverses this: an aldehyde or ketone can be reduced back to the corresponding alcohol.",
      "Carboxylic acids react with alcohols under acidic, heated conditions to form an ester and water — this condensation reaction is esterification.",
      "Esters can be hydrolysed (split by water, often with an acid or base catalyst) back into a carboxylic acid (or its salt) and an alcohol."
    ]},
    {"title":"Reagents and conditions","points":[
      "Distillation removes a volatile product (such as an aldehyde) from the reaction mixture as it forms, stopping it from reacting further.",
      "Reflux returns the vapour to the flask by continuous condensation, allowing prolonged heating without losing volatile substances — this keeps an intermediate in contact with the reagent so the reaction can go to completion.",
      "Aqueous KOH favours substitution of a haloalkane (forming an alcohol); alcoholic KOH with heat favours elimination (forming an alkene).",
      "Exact conditions — temperature, solvent, and whether the apparatus is set up for reflux or distillation — routinely change which product forms, so always state them precisely in a synthesis answer.",
      "Constitutional isomers are defined for this standard as compounds with the same molecular formula but a different structural formula — the same wording as structural isomers above."
    ]},
    {"title":"Synthesis and identification","points":[
      "Plan a synthesis by working backwards from the target functional group, one transformation at a time.",
      "For every step in a synthesis route, state the reagent, the conditions, and the structural change that occurs.",
      "Check that every intermediate you propose can actually undergo the next reaction in your route — an answer that skips a chemically impossible step will lose credit.",
      "Bromine water is decolourised by an alkene (addition across the C=C) but stays orange with an alkane — a simple test for unsaturation.",
      "Acidified potassium dichromate turns from orange to green in the presence of a primary or secondary alcohol (or an aldehyde) being oxidised, but stays orange with a tertiary alcohol.",
      "Adding aqueous sodium hydrogencarbonate to a carboxylic acid produces visible effervescence (carbon dioxide); alcohols and esters give no such reaction."
    ]}
  ],

    {"id": "91391-aq-alc-koh-rec-02", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "type": "match", "prompt": "Match the conversion to the chemistry that achieves it.", "pairs": [["Primary alcohol to aldehyde", "Controlled oxidation with distillation"], ["Primary alcohol to carboxylic acid", "Oxidation under reflux"], ["Haloalkane to alcohol", "Aqueous KOH"], ["Haloalkane to alkene", "Alcoholic KOH, heat"]]},

    {"id": "91391-tests-rec-01", "standard": "91391", "topic": "synthesis", "subtopic": "tests", "type": "choice", "prompt": "Bromine water is added to an unknown hydrocarbon and decolourises immediately. What does this suggest?", "options": ["The compound is a saturated alkane", "The compound contains a C=C double bond", "The compound is aromatic only", "No reaction is occurring"], "answer": 1, "why": "Bromine adds across a C=C double bond, decolourising the bromine water — a classic test for unsaturation."},
    {"id": "91391-reflux-rec-01", "standard": "91391", "topic": "conditions", "subtopic": "reflux", "type": "gap", "prompt": "Reflux keeps a volatile intermediate such as an aldehyde in the flask because vapour ____ back into the mixture.", "options": ["escapes permanently", "condenses and returns", "evaporates and is discarded", "reacts with air"], "answer": 1, "why": "A condenser above the flask cools rising vapour so it drips back down, allowing prolonged heating without loss of volatile material."},
    {"id": "91391-geometric-rec-01", "standard": "91391", "topic": "naming", "subtopic": "geometric", "type": "choice", "prompt": "Which pair are geometric (cis/trans) isomers of each other?", "options": ["Two structural isomers of C<sub>4</sub>H<sub>10</sub>", "Two enantiomers of a chiral molecule", "But-2-ene with the two CH<sub>3</sub> groups on the same side versus opposite sides of the C=C", "Ethanol and dimethyl ether"], "answer": 2, "why": "Restricted rotation around the C=C double bond, with two different groups on each carbon of that bond, allows the same-side (cis) and opposite-side (trans) arrangements."},
    {"id": "91391-tests-rec-02", "standard": "91391", "topic": "synthesis", "subtopic": "tests", "type": "match", "prompt": "Match the reagent or test to what it detects.", "pairs": [["Bromine water decolourises", "An alkene (C=C double bond)"], ["Acidified dichromate turns green", "A primary or secondary alcohol being oxidised"], ["NaHCO<sub>3</sub> produces fizzing", "A carboxylic acid"], ["Polarimeter rotates plane-polarised light", "A chiral / optically active compound"]]},
    {"id": "91391-aq-alc-koh-rec-new2-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "type": "choice", "prompt": "A haloalkane is heated with KOH dissolved in ethanol (alcoholic KOH). What type of reaction is favoured?", "options": ["Substitution, forming an alcohol", "Elimination, forming an alkene", "Esterification, forming an ester", "Reduction, forming an alkane"], "answer": 1, "why": "Alcoholic KOH with heat favours elimination, removing H and the halogen from adjacent carbons to form an alkene."},
    {"id": "91391-aq-alc-koh-rec-new2-02", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "type": "gap", "prompt": "Compared with alcoholic KOH, aqueous KOH favours ____, producing an alcohol as the major product.", "options": ["elimination", "substitution", "oxidation", "no reaction"], "answer": 1, "why": "The hydroxide ion in water favours acting as a nucleophile, substituting the halogen to form an alcohol."},
    {"id": "91391-aq-alc-koh-rec-new2-03", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "type": "choice", "prompt": "A chemist wants to convert a haloalkane into an alkene as efficiently as possible. Which conditions should they choose?", "options": ["KOH(aq), room temperature", "KOH(alc), heat under reflux", "H<sub>2</sub>O only, no catalyst", "NaHCO<sub>3</sub>(aq), cold"], "answer": 1, "why": "Alcoholic KOH with heat favours the elimination pathway needed to form an alkene from a haloalkane."},
    {"id": "91391-aq-alc-koh-rec-new2-04", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "type": "match", "prompt": "Match the condition or role to its outcome.", "pairs": [["KOH dissolved in water", "Favours substitution to an alcohol"], ["KOH dissolved in ethanol, heated", "Favours elimination to an alkene"], ["Hydroxide acting as a nucleophile", "Attacks the carbon bonded to the halogen"], ["Hydroxide acting as a base", "Removes H from an adjacent carbon"]]}
  ],
