    {"id": "91391-reflux-bld-01", "standard": "91391", "topic": "conditions", "subtopic": "reflux", "stem": "Reflux keeps a volatile aldehyde in the oxidising mixture leads to ____.", "options": ["further oxidation to a carboxylic acid can occur", "polymerisation is prevented", "the solution becomes non-polar", "the chiral centre is destroyed"], "answer": 0, "why": "Keeping the aldehyde in contact with the oxidant lets it be further oxidised all the way to the carboxylic acid."},
    {"id": "91391-optical-bld-01", "standard": "91391", "topic": "naming", "subtopic": "optical", "stem": "Four different groups attached to one tetrahedral carbon leads to a chiral centre leads to ____.", "options": ["geometric isomerism", "a pair of enantiomers", "addition polymerisation", "ionic bonding"], "answer": 1, "why": "A chiral centre allows two non-superimposable mirror-image forms, called enantiomers."},
    {"id": "91391-aq-alc-koh-bld-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "stem": "Alcoholic KOH with heat favours removal of H and the halogen from adjacent carbons leads to ____.", "options": ["substitution to an alcohol", "elimination to an alkene", "esterification", "reduction to an alkane"], "answer": 1, "why": "Removing H and the leaving group from neighbouring carbons forms a new C=C double bond — elimination."},
    {"id": "91391-esterification-bld-01", "standard": "91391", "topic": "reactions", "subtopic": "esterification", "stem": "A carboxylic acid reacts with an alcohol under acidic, heated conditions leads to a condensation reaction leads to ____.", "options": ["an alkene and water", "an ester and water", "a haloalkane and water", "a ketone and water"], "answer": 1, "why": "This is esterification: the acid and alcohol condense to form an ester, releasing water."},
    {"id": "91391-oxidation-bld-01", "standard": "91391", "topic": "reactions", "subtopic": "oxidation", "stem": "A secondary alcohol is oxidised leads to a carbon with only one hydrogen left to remove leads to ____.", "options": ["a carboxylic acid forms", "a ketone forms, and no further oxidation is possible", "an alkene forms", "no reaction occurs at all"], "answer": 1, "why": "Secondary alcohols oxidise only as far as a ketone, because there is no further hydrogen on that carbon for a second oxidation step."},
    {"id": "91391-tests-bld-01", "standard": "91391", "topic": "synthesis", "subtopic": "tests", "stem": "Bromine water is shaken with an alkane leads to no addition reaction is possible leads to ____.", "options": ["the bromine water decolourises", "the bromine water stays orange", "a precipitate forms", "carbon dioxide is released"], "answer": 1, "why": "Without a C=C double bond, an alkane cannot undergo an addition reaction with bromine, so the colour does not change."},
    {"id": "91391-aq-alc-koh-bld-new2-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "stem": "A haloalkane is treated with KOH(aq) leads to hydroxide acts mainly as a nucleophile leads to ____.", "options": ["the halogen is substituted, forming an alcohol", "an alkene forms by elimination", "no reaction occurs", "the haloalkane is reduced"], "answer": 0, "why": "In water, hydroxide preferentially attacks the carbon bonded to the halogen, substituting it and forming an alcohol."},

  ],
  "explain":[
    {"id": "91391-reflux-exp-01", "standard": "91391", "topic": "conditions", "subtopic": "reflux", "question": "Explain why reflux is used when oxidising a primary alcohol all the way to a carboxylic acid.", "criteria": ["prolonged heating", "volatile material retained", "aldehyde intermediate remains", "further oxidation"], "merit": "Reflux allows prolonged heating without losing volatile substances. The aldehyde intermediate remains in the reaction mixture and can be further oxidised to the carboxylic acid.", "excellence": "A primary alcohol is first oxidised to an aldehyde. Under reflux, vapours condense in the condenser and return to the flask, so the volatile aldehyde intermediate is not removed from the oxidising conditions. Because the aldehyde stays in contact with the oxidant, it undergoes further oxidation to the carboxylic acid. The apparatus and conditions therefore directly determine the final product."},
    {"id": "91391-optical-exp-01", "standard": "91391", "topic": "naming", "subtopic": "optical", "question": "Explain why 2-chlorobutane can exist as a pair of enantiomers.", "criteria": ["C<sub>2</sub> bonded to four different groups", "chiral centre", "non-superimposable mirror images", "optical activity"], "merit": "C<sub>2</sub> is bonded to H, Cl, CH<sub>3</sub> and C<sub>2</sub>H<sub>5</sub>, so it is chiral and the molecule can exist as non-superimposable mirror images.", "excellence": "The second carbon in 2-chlorobutane is tetrahedral and bonded to four different groups: H, Cl, CH<sub>3</sub> and C<sub>2</sub>H<sub>5</sub>. This makes C<sub>2</sub> a chiral centre, allowing two spatial arrangements that are mirror images but cannot be superimposed on each other. These are enantiomers, and they rotate plane-polarised light by equal amounts in opposite directions."},
    {"id": "91391-aq-alc-koh-exp-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "question": "Explain why using aqueous KOH instead of alcoholic KOH on a haloalkane changes the outcome.", "criteria": ["aqueous favours substitution", "alcoholic favours elimination", "different products form", "conditions control the pathway"], "merit": "Aqueous KOH favours nucleophilic substitution, forming an alcohol, whereas alcoholic KOH with heat favours elimination, forming an alkene. The solvent changes which reaction pathway dominates.", "excellence": "The hydroxide ion can act either as a nucleophile, attacking the carbon bonded to the halogen and substituting it to give an alcohol, or as a base, removing a hydrogen from an adjacent carbon to eliminate the halogen and form an alkene. Aqueous conditions favour the substitution pathway, giving mainly the alcohol, while alcoholic conditions with heat favour the elimination pathway, giving mainly the alkene. Because the same reagent (KOH) with the same haloalkane gives two different major products, the solvent and heat are the deciding factors, not just the reagent."},
    {"id": "91391-oxidation-exp-01", "standard": "91391", "topic": "reactions", "subtopic": "oxidation", "question": "Explain why a tertiary alcohol does not react with acidified potassium dichromate in the way a primary alcohol does.", "criteria": ["no hydrogen on the carbon bonded to OH", "oxidising agent cannot remove one", "no colour change", "resistant to oxidation"], "merit": "A tertiary alcohol has three carbon groups attached to the carbon bearing the OH group and no hydrogen left on that carbon. Since oxidation of an alcohol requires removing a hydrogen from that carbon, no oxidation and no colour change occurs.", "excellence": "Oxidation of a primary or secondary alcohol proceeds by removing a hydrogen atom from the carbon bonded to the hydroxyl group, along with the O–H hydrogen, to form a carbon-oxygen double bond. In a tertiary alcohol, that carbon is already bonded to three other carbon groups, leaving no hydrogen available to remove. Because the oxidising agent cannot carry out this step, no reaction occurs and the dichromate solution stays orange rather than turning green."},
    {"id": "91391-tests-exp-01", "standard": "91391", "topic": "synthesis", "subtopic": "tests", "question": "Explain how you would distinguish an aldehyde from a ketone using a simple chemical test, and why the test works.", "criteria": ["aldehyde is oxidised further", "ketone is not oxidised further", "colour or precipitate change", "structural difference"], "merit": "Warming with acidified dichromate (or a similar mild oxidant) oxidises an aldehyde further to a carboxylic acid, changing colour, while a ketone shows no further oxidation and no colour change, because a ketone has no hydrogen on the carbonyl carbon to remove.", "excellence": "An aldehyde has at least one hydrogen atom bonded directly to its carbonyl carbon, while a ketone has two carbon groups bonded to its carbonyl carbon and no hydrogen there. This structural difference means an aldehyde can be readily oxidised further, for example to a carboxylic acid, using a mild oxidising agent such as acidified potassium dichromate, producing a visible colour change from orange to green. A ketone cannot be oxidised in the same way because there is no hydrogen on the carbonyl carbon for the oxidant to remove, so no colour change is observed, allowing the two functional groups to be distinguished."},
    {"id": "91391-aq-alc-koh-exp-new2-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "question": "A technician has two identical samples of 2-bromopropane. One is heated with KOH(aq); the other is heated with KOH(alc). Explain why the two samples give different major products.", "criteria": ["aqueous KOH favours substitution", "alcoholic KOH with heat favours elimination", "hydroxide can act as nucleophile or base", "same reagent, different pathway depending on solvent"], "merit": "In the aqueous sample, hydroxide mostly acts as a nucleophile, substituting the bromine to form propan-2-ol. In the alcoholic sample, hydroxide mostly acts as a base, removing H and Br from adjacent carbons to form propene. The solvent, not just the reagent, determines which pathway dominates.", "excellence": "Both samples contain the same haloalkane and the same hydroxide ion, so the difference in product must come from how the solvent affects hydroxide's behaviour. In water, hydroxide is well solvated but still acts predominantly as a nucleophile, attacking the electrophilic carbon bonded to bromine and substituting it to form propan-2-ol. In ethanol under heat, hydroxide instead acts predominantly as a base, removing a hydrogen from a carbon adjacent to the C-Br bond and eliminating H-Br to form propene. Because the same reagent produces two different major products depending only on the solvent and temperature, this demonstrates that reaction conditions, not just the identity of the reagent, control the outcome of a reaction."},
    {"id": "91391-aq-alc-koh-exp-new2-02", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "question": "A student writes: 'KOH always makes an alkene from a haloalkane.' Explain why this statement is incomplete.", "criteria": ["KOH can favour substitution or elimination", "depends on aqueous vs alcoholic solvent", "depends on heat", "statement ignores conditions"], "merit": "The statement is incomplete because KOH does not always produce an alkene — it depends on the conditions. KOH dissolved in water favours substitution, forming an alcohol, while KOH dissolved in ethanol with heat favours elimination, forming an alkene.", "excellence": "The student's statement treats KOH as though it behaves identically regardless of its solvent, but hydroxide's behaviour depends heavily on the surrounding conditions. In aqueous solution, hydroxide is highly solvated and tends to act as a nucleophile, substituting the halogen in the haloalkane to produce an alcohol. In an alcoholic solvent with added heat, hydroxide instead tends to act as a base, removing a proton from an adjacent carbon and eliminating the halogen to produce an alkene. Because the same ion can lead to two structurally different products depending on solvent and temperature, correctly predicting the outcome requires specifying the exact conditions, not just naming the reagent."},
    {"id": "91391-aq-alc-koh-exp-new2-03", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "question": "Explain why heat is specifically included as part of the 'alcoholic KOH, heat' condition for elimination, rather than just 'alcoholic KOH' alone.", "criteria": ["elimination requires more energy input", "heat favours the elimination pathway", "without enough heat substitution or no reaction may dominate", "conditions must be stated precisely"], "merit": "Elimination generally requires more energy to proceed than substitution, so heat is included to favour the elimination pathway. Without enough heat, substitution or no significant reaction may occur instead, so the exact conditions must always be stated.", "excellence": "Elimination reactions generally have a higher activation energy than substitution reactions, since a hydrogen must be removed from an adjacent carbon at the same time as the halogen leaves to form the new C=C double bond. Supplying heat provides the additional energy needed to favour this higher-energy elimination pathway over the alternative substitution pathway. Without sufficient heat, the reaction is more likely to proceed by substitution or to react only slowly, so 'heat' is not a minor detail but an essential part of the specified conditions needed to reliably obtain the elimination product."}
  ],
  "apply":[
    {"id": "91391-aq-alc-koh-app-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "question": "A student uses KOH(aq) instead of KOH(alc) when they intended to make an alkene from a haloalkane. Predict the likely consequence.", "answer": "Aqueous KOH favours nucleophilic substitution rather than elimination, so the haloalkane is more likely to form an alcohol instead of the intended alkene. The solvent and conditions, not just the reagent, control which pathway dominates, so the student's product would mostly be the wrong one."},
    {"id": "91391-esterification-app-01", "standard": "91391", "topic": "reactions", "subtopic": "esterification", "question": "Design the final step needed to convert propanoic acid into propyl propanoate.", "answer": "React propanoic acid with propan-1-ol under acidic conditions (such as concentrated sulfuric acid as a catalyst) and heat. This esterification condenses the acid and alcohol to form the ester propyl propanoate and water."},
    {"id": "91391-addition-app-01", "standard": "91391", "topic": "reactions", "subtopic": "addition", "question": "But-1-ene is reacted with steam and an acid catalyst. Two possible alcohol products could form. Identify the major product and explain your reasoning.", "answer": "The major product is butan-2-ol. Addition of H–OH across the C=C places the OH group on the more substituted carbon (the carbon already attached to more alkyl groups), because the more stable intermediate forms preferentially during the addition, so butan-2-ol forms in greater amount than butan-1-ol."},
    {"id": "91391-geometric-app-01", "standard": "91391", "topic": "naming", "subtopic": "geometric", "question": "A compound with molecular formula C<sub>4</sub>H<sub>8</sub> decolourises bromine water and can be separated into two isomers that do not rotate plane-polarised light differently from each other, but do have different melting points. Suggest what type of isomerism is present and justify.", "answer": "This is geometric (cis/trans) isomerism around a C=C double bond, most likely but-2-ene. Both isomers contain the double bond (explaining the bromine water test) and differ only in the arrangement of groups across the restricted C=C bond, giving different physical properties such as melting point, but neither isomer contains a chiral centre, so optical activity is not involved."},
    {"id": "91391-multi-step-app-01", "standard": "91391", "topic": "synthesis", "subtopic": "multi-step", "question": "Outline a two-step synthesis route from propan-1-ol to propanoic acid, stating reagents and conditions for each step.", "answer": "Step 1: oxidise propan-1-ol with acidified potassium dichromate under distillation conditions to isolate propanal (the aldehyde) before it is oxidised further. Step 2: oxidise propanal with acidified potassium dichromate under reflux, keeping the volatile aldehyde in the mixture so it is fully oxidised to propanoic acid."},
    {"id": "91391-aq-alc-koh-app-new2-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "question": "A student is given an unfamiliar haloalkane, 1-chlorohexane, and asked to produce hex-1-ene as the major product. Recommend the reagent and conditions they should use, and predict what would happen if they used the wrong solvent instead.", "answer": "The student should use KOH dissolved in ethanol (alcoholic KOH) and heat the mixture under reflux, favouring elimination of H and Cl from adjacent carbons to form hex-1-ene. If they instead used KOH dissolved in water, substitution would be favoured instead of elimination, and the major product would be hexan-1-ol rather than the intended alkene."},
    {"id": "91391-aq-alc-koh-app-new2-02", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "question": "A pharmaceutical process uses a haloalkane intermediate and needs to avoid forming any alkene by-product, since the alkene is toxic. Recommend conditions that would minimise elimination, and explain your reasoning.", "answer": "The process should use KOH dissolved in water (aqueous KOH) rather than alcoholic KOH, and avoid excess heating. Aqueous conditions favour hydroxide acting as a nucleophile rather than a base, favouring substitution to form the alcohol product and minimising the elimination pathway that would produce the unwanted alkene."}
  ],
  "worked":[
    {"id": "91391-reflux-wrk-01", "standard": "91391", "topic": "conditions", "subtopic": "reflux", "title": "Primary alcohol to carboxylic acid", "question": "Explain why reflux is used when a primary alcohol is oxidised all the way to a carboxylic acid.", "plan": ["Identify the oxidation sequence.", "State what reflux does physically.", "Connect that to the aldehyde intermediate.", "Link this to the final product."], "answer": "The primary alcohol first oxidises to an aldehyde. Reflux allows the mixture to be heated for a prolonged period while vapours condense and return to the flask, so the volatile aldehyde intermediate remains in the oxidising conditions. It can therefore be oxidised further to the carboxylic acid.", "why": "This is Excellence-targeted because apparatus, reaction pathway and product are integrated rather than listed separately.", "trap": "Do not say reflux and distillation are interchangeable — distillation removes the aldehyde, reflux keeps it in the mixture."},
    {"id": "91391-optical-wrk-01", "standard": "91391", "topic": "naming", "subtopic": "optical", "title": "2-chlorobutane and optical isomerism", "question": "Explain why 2-chlorobutane has optical isomers and how they can be distinguished experimentally.", "plan": ["Locate the stereogenic carbon.", "List the four groups attached.", "Define the relationship between the isomers.", "State the optical test."], "answer": "C<sub>2</sub> is bonded to H, Cl, CH<sub>3</sub> and C<sub>2</sub>H<sub>5</sub>, so it is a chiral carbon. The molecule exists as two non-superimposable mirror images called enantiomers. A polarimeter distinguishes them because they rotate plane-polarised light by equal amounts in opposite directions.", "why": "The answer links molecular structure to stereochemistry and then to an observable, testable property.", "trap": "Do not confuse enantiomers (mirror images from a chiral centre) with geometric (cis/trans) isomers (from restricted rotation about a double bond)."},
    {"id": "91391-distillation-wrk-01", "standard": "91391", "topic": "conditions", "subtopic": "distillation", "title": "Choosing conditions to isolate an aldehyde", "question": "A primary alcohol is being oxidised and the aldehyde product is required, not the carboxylic acid. Explain how the apparatus should be set up and why.", "plan": ["State the required apparatus.", "Explain what it physically does to the aldehyde.", "Explain why this prevents further oxidation.", "State the resulting product."], "answer": "The apparatus should be set up for distillation rather than reflux. As the aldehyde forms it is volatile and boils off before it can be oxidised further; distillation removes it from the flask and collects it separately from the remaining oxidant, so it is not exposed to further oxidising conditions. The isolated product is therefore the aldehyde rather than the carboxylic acid.", "why": "Correctly contrasting distillation with reflux, and linking the apparatus choice to the chemistry, is what separates a Merit from an Excellence answer here.", "trap": "Simply naming 'distillation' without explaining why it stops further oxidation will not reach Excellence."},
    {"id": "91391-multi-step-wrk-01", "standard": "91391", "topic": "synthesis", "subtopic": "multi-step", "title": "Predicting a synthesis intermediate", "question": "Propose the intermediate compound and reagents needed to convert but-1-ene into butan-2-one in two steps.", "plan": ["Identify the target functional group.", "Work backwards to the immediately preceding compound.", "State the first reaction needed to reach that intermediate.", "Check both steps are chemically valid."], "answer": "Step 1: react but-1-ene with steam and an acid catalyst; addition across the C=C places OH on the more substituted carbon, giving butan-2-ol as the major product. Step 2: oxidise butan-2-ol (a secondary alcohol) with acidified potassium dichromate; this stops at the ketone, butan-2-one, since a secondary alcohol cannot be oxidised further.", "why": "This response plans backwards from the target, checks each intermediate is achievable, and states reagents and conditions for both steps.", "trap": "Forgetting that Markovnikov addition puts OH on the more substituted carbon would give the wrong alcohol and therefore the wrong final product."},
    {"id": "91391-aq-alc-koh-wrk-new2-01", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "title": "Choosing conditions to favour substitution", "question": "A synthesis requires converting bromoethane into ethanol, avoiding ethene as a by-product as much as possible. Explain which conditions should be used and why.", "plan": ["Identify the two possible reaction pathways for a haloalkane with hydroxide.", "State which solvent favours which pathway.", "Recommend the specific conditions needed.", "Explain why those conditions minimise the unwanted pathway."], "answer": "Bromoethane can react with hydroxide either by substitution (forming ethanol) or elimination (forming ethene). Aqueous KOH favours hydroxide acting as a nucleophile, favouring substitution, while alcoholic KOH with heat favours hydroxide acting as a base, favouring elimination. To convert bromoethane to ethanol while minimising ethene formation, KOH(aq) should be used, ideally without excess heating, since this favours the substitution pathway over elimination.", "why": "This is Excellence-targeted because it explicitly compares both possible pathways before recommending conditions, rather than just stating the answer.", "trap": "Do not assume any reaction with a haloalkane and hydroxide automatically gives one specific product — the solvent and temperature must be specified to control which pathway dominates."},
    {"id": "91391-aq-alc-koh-wrk-new2-02", "standard": "91391", "topic": "conditions", "subtopic": "aq-alc-koh", "title": "Predicting the effect of changing solvent mid-synthesis", "question": "A synthesis route calls for KOH(alc) with heat to convert a haloalkane into an alkene, but a technician accidentally substitutes KOH(aq) at room temperature. Predict and explain the effect on the final product.", "plan": ["State the intended pathway and product.", "State which pathway the substituted conditions actually favour.", "Identify the product that would actually form.", "Explain why this differs from the intended outcome."], "answer": "The intended conditions, KOH(alc) with heat, favour elimination, producing an alkene. The substituted conditions, KOH(aq) at room temperature, instead favour substitution, since aqueous hydroxide tends to act as a nucleophile rather than a base, and without added heat the higher-energy elimination pathway is even less likely to occur. As a result, the technician would obtain mainly the corresponding alcohol instead of the intended alkene, an unintended change in product caused entirely by the change in solvent and temperature, not the reagent itself.", "why": "This response tracks the consequence of a conditions change through to a specific, correctly reasoned product outcome, which is exactly the kind of 'predict and explain' reasoning Excellence responses require.", "trap": "Do not assume the reagent (KOH) alone determines the product — solvent and heat are just as important as the reagent identity itself."}
  ],

"91392": {
  "id":"91392","title":"Aqueous Systems","icon":"droplet","colour":"aqueous",
  "summary":"Species in solution, acid-base equilibria, buffers, titrations, solubility, K<sub>s</sub> and precipitation.",
  "learn":[
    {"title":"Species in solution","points":[
      "Before calculating anything, list the significant species actually present in solution — this single habit prevents most equilibrium errors.",
      "Decide first whether a stoichiometric (essentially complete) reaction happens, and only then whether an equilibrium needs to be considered afterwards.",
      "Strong acids and strong bases ionise essentially completely in water; weak acids and weak bases only partially ionise and establish an equilibrium.",
      "Common strong acids include HCl, HNO<sub>3</sub> and H<sub>2</sub>SO<sub>4</sub> (first ionisation); common strong bases include the Group 1 hydroxides such as NaOH and KOH.",
      "Common weak acids include ethanoic acid (CH<sub>3</sub>COOH), other carboxylic acids, and NH<sub>4</sub><sup>+</sup>; common weak bases include ammonia (NH<sub>3</sub>) and CO<sub>3</sub><sup>2-</sup>/HCO<sub>3</sub><sup>-</sup>.",
      "A salt can make a solution acidic, basic or neutral depending on whether its ions hydrolyse: NH<sub>4</sub>Cl is acidic (NH<sub>4</sub><sup>+</sup> is a weak acid), CH<sub>3</sub>COONa is basic (CH<sub>3</sub>COO<sup>-</sup> is a weak base), NaCl is neutral (neither ion hydrolyses).",
      "K<sub>a</sub> x K<sub>b</sub> = K<sub>w</sub> for a conjugate acid-base pair, which lets you calculate K<sub>b</sub> (or pK<sub>b</sub>) from K<sub>a</sub> even when it is not given directly."
    ]},
    {"title":"Buffers","points":[
      "A buffer contains appreciable amounts of both a weak acid (or base) and its conjugate partner, usually in comparable concentrations.",
      "Added H<sub>3</sub>O<sup>+</sup> reacts mainly with the conjugate base component; added OH<sup>-</sup> reacts mainly with the weak acid component — either way, most of the added ion is consumed.",
      "A buffer resists a large pH change, but pH still changes slightly, because the ratio of the two components shifts a little each time something is added.",
      "For a weak acid buffer, pH = pK<sub>a</sub> + log([conjugate base] / [weak acid]) — when the two concentrations are equal, pH equals pK<sub>a</sub> exactly.",
      "Buffer capacity depends on the actual amount (not just the ratio) of each component present — a buffer with more moles of both components can absorb a larger addition of acid or base before its pH changes significantly.",
      "A buffer's most effective working range is roughly pK<sub>a</sub> plus or minus one pH unit."
    ]},
    {"title":"Titration curves","points":[
      "The initial pH of a titration curve is set entirely by the acid (or base) in the flask before any titrant has been added.",
      "The gently sloping buffer region appears once some of the acid has reacted with the added base, creating a mixture of the weak acid and its conjugate base.",
      "At half-equivalence in a weak acid / strong base titration, exactly half the acid has reacted, so [HA] = [A<sup>-</sup>] and pH = pK<sub>a</sub>.",
      "The equivalence point is where moles of acid exactly equal moles of base added — but for a weak acid titrated with a strong base, the solution at equivalence contains only the conjugate base, which hydrolyses to make the solution basic (pH greater than 7), not neutral.",
      "Symmetrically, for a weak base titrated with a strong acid, the equivalence point is acidic (pH less than 7) because the conjugate acid remaining hydrolyses.",
      "After equivalence, pH is controlled almost entirely by the excess strong titrant, since it overwhelms the small equilibrium contribution of the weak component."
    ]},
    {"title":"Solubility and K<sub>s</sub>","points":[
      "K<sub>s</sub> is an equilibrium constant for a saturated solution in contact with undissolved solid — it is not the same number as molar solubility, though the two are related.",
      "For a salt that dissolves as MX, K<sub>s</sub> = s²; for a salt that dissolves as MX<sub>2</sub> (or M<sub>2</sub>X), K<sub>s</sub> = 4s³ — using the correct stoichiometric form matters.",
      "Always recalculate ion concentrations using the total volume after mixing two solutions, never the original stock concentrations, before calculating an ionic product.",
      "Compare the calculated ionic product (IP) with K<sub>s</sub>: if IP is greater than K<sub>s</sub> the solution is supersaturated and precipitation is favoured; if IP is less than K<sub>s</sub>, no precipitate forms.",
      "Adding a common ion usually decreases solubility, because it shifts the dissolving equilibrium back toward the solid (Le Chatelier's principle).",
      "Complex-ion formation can increase solubility, because forming a stable complex ion removes free metal ions from solution, pulling the dissolving equilibrium further toward dissolution.",
      "Nine complex ions are supplied with their formulae in the resource booklet: [Ag(CN)<sub>2</sub>]<sup>-</sup>, [Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup>, [Al(OH)<sub>4</sub>]<sup>-</sup>, [Cu(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>, [Pb(OH)<sub>4</sub>]<sup>2-</sup>, [Zn(OH)<sub>4</sub>]<sup>2-</sup>, [Zn(NH<sub>3</sub>)<sub>4</sub>]<sup>2+</sup>, [Ni(NH<sub>3</sub>)<sub>6</sub>]<sup>2+</sup> and [Ni(CN)<sub>4</sub>]<sup>2-</sup> — you need to know how to use them, not memorise them."
    ]}
  ],
  "diagram":"titration",
  "recognise":[
    {"id": "91392-weak-acid-rec-01", "standard": "91392", "topic": "species", "subtopic": "weak-acid", "type": "gap", "prompt": "For a weak acid solution, the major acid species present is usually ____ because ionisation is only partial.", "options": ["A<sup>-</sup>", "HA", "OH<sup>-</sup>", "H<sub>2</sub> only"], "answer": 1, "why": "Most weak-acid particles remain as intact HA molecules, with only a small fraction ionised."},
    {"id": "91392-half-eq-rec-01", "standard": "91392", "topic": "titration", "subtopic": "half-eq", "type": "choice", "prompt": "At half-equivalence in a weak acid / strong base titration, which relationship is correct?", "options": ["pH = 7", "pH = pK<sub>a</sub>", "pH = pK<sub>b</sub>", "[HA] = 0"], "answer": 1, "why": "At half-equivalence, [HA] equals [A<sup>-</sup>], so the log term in pH = pK<sub>a</sub> + log([A<sup>-</sup>]/[HA]) becomes zero and pH = pK<sub>a</sub>."},
    {"id": "91392-added-acid-rec-01", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "type": "match", "prompt": "Match the situation to the first chemical response that occurs.", "pairs": [["Add H<sub>3</sub>O<sup>+</sup> to an acid buffer", "The conjugate base consumes most of the added H<sub>3</sub>O<sup>+</sup>"], ["Add OH<sup>-</sup> to an acid buffer", "The weak acid consumes most of the added OH<sup>-</sup>"], ["IP is greater than K<sub>s</sub>", "Precipitation is favoured"], ["A common ion is added", "Solubility usually decreases"]]},
    {"id": "91392-equivalence-rec-01", "standard": "91392", "topic": "titration", "subtopic": "equivalence", "type": "gap", "prompt": "At the equivalence point of a weak acid titrated with a strong base, the solution is ____ because the conjugate base hydrolyses.", "options": ["strongly acidic", "exactly neutral", "basic", "impossible to determine"], "answer": 2, "why": "The remaining conjugate base reacts with water to produce OH<sup>-</sup>, making the equivalence point solution basic rather than neutral."},
    {"id": "91392-salts-rec-01", "standard": "91392", "topic": "species", "subtopic": "salts", "type": "choice", "prompt": "Which salt produces an acidic solution when dissolved in water?", "options": ["NaCl", "CH<sub>3</sub>COONa", "NH<sub>4</sub>Cl", "KNO<sub>3</sub>"], "answer": 2, "why": "NH<sub>4</sub><sup>+</sup> is the conjugate acid of the weak base NH<sub>3</sub>, so it hydrolyses to produce H<sub>3</sub>O<sup>+</sup>, making the solution acidic."},
    {"id": "91392-ks-expression-rec-01", "standard": "91392", "topic": "solubility", "subtopic": "ks-expression", "type": "gap", "prompt": "For a salt that dissolves as MX<sub>2</sub>, the correct solubility product expression in terms of molar solubility s is K<sub>s</sub> = ____.", "options": ["s", "s squared", "4s cubed", "2s"], "answer": 2, "why": "Dissolving one mole of MX<sub>2</sub> gives one M ion and two X ions, so K<sub>s</sub> = [M][X]<sup>2</sup> = s x (2s)<sup>2</sup> = 4s<sup>3</sup>."},
    {"id": "91392-complex-ion-rec-01", "standard": "91392", "topic": "solubility", "subtopic": "complex-ion", "type": "choice", "prompt": "Adding excess ammonia to a precipitate of AgCl can dissolve it. What is happening?", "options": ["Ammonia is acting as a common ion", "Ammonia forms the complex ion [Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup>, removing free Ag<sup>+</sup> and increasing solubility", "Ammonia neutralises the chloride ion", "No reaction is possible"], "answer": 1, "why": "Forming the stable complex ion removes free Ag<sup>+</sup> from solution, pulling the dissolving equilibrium further toward dissolution and increasing solubility."},
    {"id": "91392-initial-rec-01", "standard": "91392", "topic": "titration", "subtopic": "initial", "type": "match", "prompt": "Match the region of a titration curve to what controls the pH there.", "pairs": [["Before any titrant is added", "The acid (or base) alone"], ["The gently sloping middle region", "The buffer mixture of the weak acid and its conjugate base"], ["The equivalence point", "Hydrolysis of the remaining conjugate species"], ["Well after equivalence", "The excess strong titrant"]]},
    {"id": "91392-weak-acid-rec-02", "standard": "91392", "topic": "species", "subtopic": "weak-acid", "type": "gap", "prompt": "K<sub>a</sub> multiplied by K<sub>b</sub> for a conjugate acid-base pair always equals ____ (at 25 degrees C).", "options": ["1", "zero", "K<sub>w</sub>", "pH"], "answer": 2, "why": "K<sub>a</sub> x K<sub>b</sub> = K<sub>w</sub> for any conjugate acid-base pair, which lets K<sub>b</sub> be calculated from K<sub>a</sub> even when it is not supplied directly."},
    {"id": "91392-added-acid-rec-new01", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "type": "choice", "prompt": "A buffer made from ethanoic acid and sodium ethanoate has a small amount of dilute HCl added. Which species reacts with most of the added H<sub>3</sub>O<sup>+</sup>?", "options": ["H<sub>2</sub>O", "CH<sub>3</sub>COOH", "CH<sub>3</sub>COO<sup>-</sup>", "Na<sup>+</sup>"], "answer": 2, "why": "The conjugate base, ethanoate (CH<sub>3</sub>COO<sup>-</sup>), reacts with the added H<sub>3</sub>O<sup>+</sup> to form CH<sub>3</sub>COOH and water, removing most of the added acid from solution."},
    {"id": "91392-added-acid-rec-new02", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "type": "gap", "prompt": "When H<sub>3</sub>O<sup>+</sup> is added to a buffer, the concentration of the weak acid component ____ slightly while the concentration of the conjugate base ____ slightly.", "options": ["increases; increases", "increases; decreases", "decreases; increases", "stays constant; stays constant"], "answer": 1, "why": "The conjugate base is consumed as it reacts with the added H<sub>3</sub>O<sup>+</sup>, forming more of the weak acid, so [weak acid] rises a little and [conjugate base] falls a little."},
    {"id": "91392-added-acid-rec-new03", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "type": "choice", "prompt": "Why does the pH of a buffer fall only slightly, rather than sharply, when a small amount of strong acid is added?", "options": ["The buffer has an unlimited supply of conjugate base", "Most of the added H<sub>3</sub>O<sup>+</sup> is consumed by the conjugate base before it can accumulate", "The added acid instantly evaporates", "The pK<sub>a</sub> of the buffer changes to compensate"], "answer": 1, "why": "Because most of the added H<sub>3</sub>O<sup>+</sup> reacts with the conjugate base, only a small increase in free [H<sub>3</sub>O<sup>+</sup>] remains, so pH changes only slightly."},
    {"id": "91392-added-acid-rec-new04", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "type": "gap", "prompt": "If enough strong acid is added to completely convert the conjugate base into weak acid, the buffer's ____ has been exceeded, and further acid will change pH rapidly.", "options": ["pK<sub>a</sub>", "volume", "buffer capacity", "molarity"], "answer": 2, "why": "Once the conjugate base component is used up, the mixture can no longer resist further pH change from added acid — the buffer capacity has been exceeded."},
    {"id": "91392-added-acid-rec-new05", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "type": "match", "prompt": "Match each step in a buffer's response to added acid to what happens.", "pairs": [["Added H<sub>3</sub>O<sup>+</sup>", "Reacts mainly with the conjugate base (A<sup>-</sup>)"], ["Result of that reaction", "More HA formed, less A<sup>-</sup> remaining"], ["Effect on the A<sup>-</sup>/HA ratio", "Ratio decreases slightly"], ["Effect on pH", "Falls slightly, not sharply"]]}
  ],
  "build":[
    {"id": "91392-added-acid-bld-01", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "stem": "Added H<sub>3</sub>O<sup>+</sup> reacts with the conjugate base leads to slightly more HA and slightly less A<sup>-</sup> leads to ____.", "options": ["pH rises dramatically", "pH falls only slightly", "pH stays exactly constant", "K<sub>a</sub> becomes zero"], "answer": 1, "why": "The buffer removes most, but not all, of the added acid, so pH changes only slightly rather than dramatically."},
    {"id": "91392-ip-bld-01", "standard": "91392", "topic": "solubility", "subtopic": "ip", "stem": "Two ionic solutions are mixed leads to concentrations must be recalculated using the total volume leads to ____.", "options": ["compare the ionic product with K<sub>s</sub>", "compare the ionic product with the molar mass", "compare pK<sub>a</sub> only", "compare with ΔH"], "answer": 0, "why": "Precipitation is predicted by comparing the ionic product, calculated with post-mixing concentrations, against K<sub>s</sub>."},
    {"id": "91392-common-ion-bld-01", "standard": "91392", "topic": "solubility", "subtopic": "common-ion", "stem": "A common ion is added to a saturated solution leads to the ionic product temporarily exceeds K<sub>s</sub> leads to ____.", "options": ["more solid dissolves", "more solid precipitates until equilibrium is restored", "the equilibrium constant changes", "nothing happens"], "answer": 1, "why": "Le Chatelier's principle: the system shifts to remove the excess ions, precipitating more solid until IP returns to K<sub>s</sub>."},
    {"id": "91392-equivalence-bld-01", "standard": "91392", "topic": "titration", "subtopic": "equivalence", "stem": "A weak base is titrated with a strong acid leads to the conjugate acid remains at equivalence leads to ____.", "options": ["the equivalence point is basic", "the equivalence point is exactly pH 7", "the equivalence point is acidic", "no equivalence point exists"], "answer": 2, "why": "The conjugate acid remaining after the reaction hydrolyses in water, releasing H<sub>3</sub>O<sup>+</sup> and making the equivalence point acidic."},
    {"id": "91392-complex-ion-bld-01", "standard": "91392", "topic": "solubility", "subtopic": "complex-ion", "stem": "A stable complex ion forms with a dissolved metal ion leads to free metal-ion concentration decreases leads to ____.", "options": ["the dissolving equilibrium shifts toward more solid", "the dissolving equilibrium shifts toward more dissolution, increasing solubility", "K<sub>s</sub> increases permanently", "no change occurs"], "answer": 1, "why": "Removing free metal ions as a complex pulls the equilibrium MX(s) in equilibrium with M<sup>+</sup> + X<sup>-</sup> further to the right, increasing how much solid can dissolve."},
    {"id": "91392-capacity-bld-01", "standard": "91392", "topic": "buffers", "subtopic": "capacity", "stem": "A buffer contains a large amount of both the weak acid and its conjugate base leads to a large reserve of both components leads to ____.", "options": ["a smaller buffer capacity", "a larger buffer capacity", "no buffering action at all", "a fixed pH regardless of what is added"], "answer": 1, "why": "More moles of both buffer components can absorb a larger addition of acid or base before the ratio, and therefore the pH, changes significantly."},
    {"id": "91392-added-acid-bld-new01", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "stem": "Small amount of HCl added to an ethanoic acid/ethanoate buffer leads to CH<sub>3</sub>COO<sup>-</sup> reacts with most of the added H<sub>3</sub>O<sup>+</sup> leads to ____.", "options": ["[CH<sub>3</sub>COOH] rises and [CH<sub>3</sub>COO<sup>-</sup>] falls slightly", "[CH<sub>3</sub>COOH] falls and [CH<sub>3</sub>COO<sup>-</sup>] rises slightly", "both concentrations stay exactly the same", "the buffer immediately fails"], "answer": 0, "why": "The reaction CH<sub>3</sub>COO<sup>-</sup> + H<sub>3</sub>O<sup>+</sup> → CH<sub>3</sub>COOH + H<sub>2</sub>O converts some conjugate base into weak acid, so [CH<sub>3</sub>COOH] rises slightly and [CH<sub>3</sub>COO<sup>-</sup>] falls slightly."},
    {"id": "91392-added-acid-bld-new02", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "stem": "The A<sup>-</sup>/HA ratio decreases slightly after acid is added to a buffer leads to log([A<sup>-</sup>]/[HA]) becomes slightly more negative leads to ____.", "options": ["pH rises slightly", "pH falls slightly", "pH stays exactly at pK<sub>a</sub>", "pK<sub>a</sub> itself decreases"], "answer": 1, "why": "A smaller ratio gives a smaller (more negative) log term, so pH = pK<sub>a</sub> + log(ratio) decreases slightly, meaning the pH falls a little."},
    {"id": "91392-added-acid-bld-new03", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "stem": "Enough strong acid is added to convert essentially all of the conjugate base into weak acid leads to almost no conjugate base remains to react with further H<sub>3</sub>O<sup>+</sup> leads to ____.", "options": ["the buffer capacity is exceeded and pH now falls rapidly", "the buffer becomes stronger", "pH stays constant indefinitely", "the weak acid turns into its conjugate base"], "answer": 0, "why": "Once the conjugate base reservoir is used up, additional H<sub>3</sub>O<sup>+</sup> is no longer consumed by a buffering reaction, so pH begins to fall rapidly rather than gradually."}
  ],
  "explain":[
    {"id": "91392-added-acid-exp-01", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "question": "Explain how an ethanoic acid / ethanoate buffer resists a small addition of HCl.", "criteria": ["HCl produces H<sub>3</sub>O<sup>+</sup>", "ethanoate reacts with H<sub>3</sub>O<sup>+</sup>", "ethanoic acid forms", "most added H<sub>3</sub>O<sup>+</sup> removed", "pH decreases slightly"], "merit": "Added H<sub>3</sub>O<sup>+</sup> reacts with CH<sub>3</sub>COO<sup>-</sup> to form CH<sub>3</sub>COOH and water. Because most of the added H<sub>3</sub>O<sup>+</sup> is removed, the pH changes only slightly.", "excellence": "HCl ionises in water and initially increases [H<sub>3</sub>O<sup>+</sup>]. The conjugate base CH<sub>3</sub>COO<sup>-</sup> reacts with most of this added H<sub>3</sub>O<sup>+</sup> to form CH<sub>3</sub>COOH and H<sub>2</sub>O. Consequently [CH<sub>3</sub>COO<sup>-</sup>] decreases slightly while [CH<sub>3</sub>COOH] increases slightly. Because most of the added H<sub>3</sub>O<sup>+</sup> is consumed by this reaction, its equilibrium concentration rises only a little, so the pH falls only slightly rather than changing dramatically."},
    {"id": "91392-common-ion-exp-01", "standard": "91392", "topic": "solubility", "subtopic": "common-ion", "question": "Explain why adding AgNO<sub>3</sub> decreases the solubility of Ag<sub>2</sub>CrO<sub>4</sub>.", "criteria": ["Ag<sup>+</sup> is a common ion", "Ag<sup>+</sup> concentration increases", "equilibrium shifts left", "more solid forms", "solubility decreases"], "merit": "AgNO<sub>3</sub> adds the common ion Ag<sup>+</sup>. Increasing [Ag<sup>+</sup>] shifts the dissolution equilibrium left, forming more solid and decreasing solubility.", "excellence": "AgNO<sub>3</sub> dissociates completely and increases [Ag<sup>+</sup>], which is a product in the equilibrium Ag<sub>2</sub>CrO<sub>4</sub>(s) in equilibrium with 2Ag<sup>+</sup> + CrO<sub>4</sub><sup>2-</sup>. The increased product concentration makes the ionic product exceed the equilibrium value, so the system shifts toward the solid until equilibrium is restored. More Ag<sub>2</sub>CrO<sub>4</sub> precipitates and the amount that remains dissolved decreases, so its solubility is lower than in pure water."},
    {"id": "91392-equivalence-exp-01", "standard": "91392", "topic": "titration", "subtopic": "equivalence", "question": "Explain why the equivalence point of a weak acid titrated with a strong base is not pH 7.", "criteria": ["conjugate base remains", "hydrolysis of conjugate base", "produces OH<sup>-</sup>", "solution is basic"], "merit": "At equivalence, all the weak acid has reacted to form its conjugate base. This conjugate base reacts with water (hydrolyses), producing OH<sup>-</sup> and making the solution basic rather than neutral.", "excellence": "At the equivalence point, the moles of strong base added exactly equal the original moles of weak acid, so the solution contains only the conjugate base of the weak acid (plus spectator ions) dissolved in water. Because this conjugate base is itself a weak base, it reacts with water in a hydrolysis equilibrium, producing OH<sup>-</sup> ions. This shifts the solution's pH above 7, so the equivalence point of a weak acid / strong base titration is always basic, never exactly neutral."},
    {"id": "91392-capacity-exp-01", "standard": "91392", "topic": "buffers", "subtopic": "capacity", "question": "Explain why a buffer's pH changes only slightly rather than not at all when acid or base is added.", "criteria": ["ratio of components shifts", "not an infinite reserve", "small equilibrium concentration change", "pH depends on the ratio"], "merit": "A buffer only reduces the change in pH, it does not eliminate it, because adding acid or base still slightly shifts the ratio of the weak acid to its conjugate base, which changes pH according to pH = pK<sub>a</sub> + log([A<sup>-</sup>]/[HA]).", "excellence": "A buffer works by having most of the added H<sub>3</sub>O<sup>+</sup> or OH<sup>-</sup> consumed by one of its two components, but this consumption is not perfectly complete and it does change the relative amounts of the weak acid and its conjugate base present. Because pH depends on the ratio of these two concentrations through pH = pK<sub>a</sub> + log([A<sup>-</sup>]/[HA]), any change in that ratio produces some change in pH, just a much smaller one than would occur without the buffer. If enough acid or base is added to use up one of the components entirely, the buffer capacity is exceeded and the pH then changes rapidly."},
    {"id": "91392-complex-ion-exp-01", "standard": "91392", "topic": "solubility", "subtopic": "complex-ion", "question": "Explain why [Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup> forming allows AgCl to dissolve in excess aqueous ammonia even though AgCl is normally very insoluble.", "criteria": ["complex ion forms", "free Ag<sup>+</sup> removed", "equilibrium shifts toward dissolving", "more AgCl dissolves"], "merit": "Ammonia reacts with Ag<sup>+</sup> to form the stable complex ion [Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup>, removing free Ag<sup>+</sup> from solution. This shifts the AgCl dissolving equilibrium further toward dissolution, so more AgCl dissolves.", "excellence": "In the equilibrium AgCl(s) in equilibrium with Ag<sup>+</sup> + Cl<sup>-</sup>, the position of equilibrium depends on the concentration of free Ag<sup>+</sup> remaining in solution. When excess ammonia is added, Ag<sup>+</sup> reacts with NH<sub>3</sub> to form the stable complex ion [Ag(NH<sub>3</sub>)<sub>2</sub>]<sup>+</sup>, which continuously removes free Ag<sup>+</sup> from solution. According to Le Chatelier's principle, the dissolving equilibrium responds by shifting further to the right to replace the removed Ag<sup>+</sup>, so more solid AgCl dissolves than would in pure water. This is why AgCl, despite its very small K<sub>s</sub>, will dissolve in excess aqueous ammonia."},
    {"id": "91392-initial-exp-01", "standard": "91392", "topic": "titration", "subtopic": "initial", "question": "Explain why the initial pH of a weak acid titration is higher than the initial pH of a strong acid of the same starting concentration.", "criteria": ["weak acid partially ionises", "fewer H<sub>3</sub>O<sup>+</sup> ions produced", "strong acid ionises completely", "higher pH for the weak acid"], "merit": "The strong acid ionises essentially completely, producing a high [H<sub>3</sub>O<sup>+</sup>] and low pH. The weak acid only partially ionises, so it produces far less H<sub>3</sub>O<sup>+</sup> at the same starting concentration, giving it a higher initial pH.", "excellence": "For a strong acid, essentially every molecule ionises, so [H<sub>3</sub>O<sup>+</sup>] is approximately equal to the original acid concentration. For a weak acid of the same starting concentration, only a small fraction of the HA molecules ionise before the system reaches equilibrium, since K<sub>a</sub> for a weak acid is small. This means [H<sub>3</sub>O<sup>+</sup>] produced by the weak acid is considerably lower than that produced by the strong acid at the same concentration, so pH = −log[H<sub>3</sub>O<sup>+</sup>] gives the weak acid solution a higher (less acidic) initial pH than the strong acid, even though both started at the same concentration."},
    {"id": "91392-added-acid-exp-new01", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "question": "A buffer contains equal concentrations of ethanoic acid and ethanoate. A small amount of HCl is added. Explain what happens to the pH, and why the change is small rather than large.", "criteria": ["H<sub>3</sub>O<sup>+</sup> reacts with ethanoate", "forms more ethanoic acid", "ratio of A<sup>-</sup>/HA decreases slightly", "pH falls slightly not sharply"], "merit": "The added H<sub>3</sub>O<sup>+</sup> reacts with CH<sub>3</sub>COO<sup>-</sup> to form CH<sub>3</sub>COOH, consuming most of the added acid. This slightly decreases the CH<sub>3</sub>COO<sup>-</sup>/CH<sub>3</sub>COOH ratio, so the pH falls, but only slightly because most of the added H<sub>3</sub>O<sup>+</sup> was removed from solution by this reaction rather than remaining free.", "excellence": "When HCl is added, it ionises completely and increases [H<sub>3</sub>O<sup>+</sup>]. Because the mixture contains an appreciable amount of the conjugate base CH<sub>3</sub>COO<sup>-</sup>, most of this added H<sub>3</sub>O<sup>+</sup> reacts with CH<sub>3</sub>COO<sup>-</sup> to form CH<sub>3</sub>COOH and water, so only a small fraction of the added H<sub>3</sub>O<sup>+</sup> remains as free H<sub>3</sub>O<sup>+</sup> in solution. This reaction slightly decreases [CH<sub>3</sub>COO<sup>-</sup>] and slightly increases [CH<sub>3</sub>COOH], reducing the CH<sub>3</sub>COO<sup>-</sup>/CH<sub>3</sub>COOH ratio a little. Since pH = pK<sub>a</sub> + log([CH<sub>3</sub>COO<sup>-</sup>]/[CH<sub>3</sub>COOH]), a small decrease in this ratio produces only a small decrease in pH, rather than the large pH drop that would occur if the same amount of HCl were added to unbuffered water."},
    {"id": "91392-added-acid-exp-new02", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "question": "Two students add the same small amount of HCl to two different buffers with the same pK<sub>a</sub>: Buffer 1 has 0.100 mol of each component, and Buffer 2 has 0.010 mol of each component. Explain which buffer's pH changes less, and why.", "criteria": ["both have the same initial ratio", "buffer 1 has more conjugate base available", "more moles can absorb more added acid", "buffer 1 changes less"], "merit": "Buffer 1 has ten times as many moles of conjugate base available to react with the added H<sub>3</sub>O<sup>+</sup>, so the same small addition of acid changes buffer 1's A<sup>-</sup>/HA ratio, and therefore its pH, by a smaller amount than in buffer 2, which has much less conjugate base to consume the acid.", "excellence": "Both buffers start with the same pH, since pH = pK<sub>a</sub> + log([A<sup>-</sup>]/[HA]) and both have an equal-mole (and therefore equal-ratio) mixture of the two components. However, a fixed small amount of added H<sub>3</sub>O<sup>+</sup> represents a much smaller fraction of buffer 1's larger reserve of conjugate base (0.100 mol) than of buffer 2's smaller reserve (0.010 mol). Because the same absolute amount of H<sub>3</sub>O<sup>+</sup> changes buffer 1's A<sup>-</sup>/HA ratio proportionally less than buffer 2's ratio, buffer 1's pH changes by a smaller amount. This shows that buffer capacity depends on the actual amount of each component present, not just their ratio."},
    {"id": "91392-added-acid-exp-new03", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "question": "A student says 'adding acid to a buffer does nothing because buffers keep pH constant.' Explain what is wrong with this statement.", "criteria": ["buffers resist change, not eliminate it", "ratio still shifts slightly", "pH does change slightly", "capacity can be exceeded"], "merit": "A buffer resists a large pH change but does not keep pH perfectly constant. Adding acid still consumes some of the conjugate base and slightly shifts the A<sup>-</sup>/HA ratio, which produces a small change in pH, and enough added acid can exceed the buffer's capacity and cause a large pH change.", "excellence": "The student's claim confuses resisting pH change with preventing it entirely. When H<sub>3</sub>O<sup>+</sup> is added, it is consumed mainly by the conjugate base, which minimises the increase in free [H<sub>3</sub>O<sup>+</sup>], but this reaction still converts some conjugate base into weak acid, changing the A<sup>-</sup>/HA ratio slightly. Since pH is a function of this ratio, a small pH change necessarily occurs, even though it is much smaller than it would be in an unbuffered solution. If enough acid is added that the conjugate base is essentially all converted to weak acid, the buffer's capacity is exceeded and further acid causes the pH to fall rapidly, exactly as it would with no buffer present at all."}
  ],
  "apply":[
    {"id": "91392-added-base-app-01", "standard": "91392", "topic": "buffers", "subtopic": "added-base", "question": "A few drops of NaOH are added to an ethanoic acid / ethanoate buffer. Explain the buffer's response.", "answer": "The added OH<sup>-</sup> reacts mainly with CH<sub>3</sub>COOH: CH<sub>3</sub>COOH + OH<sup>-</sup> gives CH<sub>3</sub>COO<sup>-</sup> + H<sub>2</sub>O. This consumes most of the added OH<sup>-</sup>, slightly decreasing [CH<sub>3</sub>COOH] and increasing [CH<sub>3</sub>COO<sup>-</sup>]. The conjugate base to acid ratio rises slightly, so the pH rises slightly rather than dramatically."},
    {"id": "91392-ip-app-01", "standard": "91392", "topic": "solubility", "subtopic": "ip", "question": "After mixing two salt solutions, the calculated ionic product is greater than K<sub>s</sub> for one of the possible products. Predict what happens and explain.", "answer": "The mixture is supersaturated with respect to that compound. Precipitation occurs, removing ions from solution until the remaining ionic product falls back to equal K<sub>s</sub>, at which point equilibrium is restored."},
    {"id": "91392-weak-base-app-01", "standard": "91392", "topic": "species", "subtopic": "weak-base", "question": "A student adds solid NH<sub>4</sub>Cl to a solution of ammonia. Predict and justify the effect on the pH of the ammonia solution.", "answer": "NH<sub>4</sub>Cl provides NH<sub>4</sub><sup>+</sup>, the conjugate acid of NH<sub>3</sub>. Adding it shifts the ammonia ionisation equilibrium (NH<sub>3</sub> + H<sub>2</sub>O in equilibrium with NH<sub>4</sub><sup>+</sup> + OH<sup>-</sup>) to the left through the common-ion effect, reducing [OH<sup>-</sup>] and lowering the pH compared with the ammonia solution alone. The mixture also now behaves as an NH<sub>3</sub> / NH<sub>4</sub><sup>+</sup> buffer."},
    {"id": "91392-ks-expression-app-01", "standard": "91392", "topic": "solubility", "subtopic": "ks-expression", "question": "A saturated solution of PbCl<sub>2</sub> is prepared. Explain, using K<sub>s</sub> = 4s³, why this expression rather than K<sub>s</sub> = s² is appropriate here.", "answer": "PbCl<sub>2</sub> dissolves as Pb<sup>2+</sup> + 2Cl<sup>-</sup>, so for every s mol L⁻¹ of PbCl<sub>2</sub> that dissolves, the chloride concentration is 2s, not s. Substituting into K<sub>s</sub> = [Pb<sup>2+</sup>][Cl<sup>-</sup>]<sup>2</sup> gives K<sub>s</sub> = (s)(2s)<sup>2</sup> = 4s<sup>3</sup>, which correctly accounts for the 1:2 stoichiometry, unlike K<sub>s</sub> = s<sup>2</sup> which only applies to a salt that dissolves in a 1:1 ratio."},
    {"id": "91392-buffer-components-app-01", "standard": "91392", "topic": "buffers", "subtopic": "buffer-components", "question": "A weak acid HA has pK<sub>a</sub> = 4.8. Estimate the pH of a buffer made with equal moles of HA and its salt NaA, and explain your reasoning without a calculator.", "answer": "When the moles (and therefore concentrations, in the same total volume) of HA and A<sup>-</sup> are equal, the ratio [A<sup>-</sup>]/[HA] equals 1, and log(1) = 0. Using pH = pK<sub>a</sub> + log([A<sup>-</sup>]/[HA]), the pH of this buffer is simply equal to pK<sub>a</sub>, so pH is approximately 4.8."},
    {"id": "91392-added-acid-app-new01", "standard": "91392", "topic": "buffers", "subtopic": "added-acid", "question": "A pharmaceutical company adds a small amount of a strong acid preservative to an intravenous saline solution buffered with a phosphate buffer (H<sub>2</sub>PO<sub>4</sub><sup>-</sup>/HPO<sub>4</sub><sup>2-</sup>) to keep its pH stable during storage. Predict what happens to the ratio of the two phosphate species, and to the solution's pH.", "answer": "The added H<sub>3</sub>O<sup>+</sup> reacts mainly with the conjugate base, HPO<sub>4</sub><sup>2-</sup>, converting some of it into H<sub>2</sub>PO<sub>4</sub><sup>-</sup>. This decreases the HPO<sub>4</sub><sup>2-</sup>/H<sub>2</sub>PO<sub>4</sub><sup>-</sup> ratio slightly, which produces only a small decrease in pH rather than a large one, because most of the added H<sub>3</sub>O<sup>+</sup> has been consumed by this reaction rather than remaining as free H<sub>3</sub>O<sup>+</sup> in the solution."},

/* ---- Progress schema (v2) ----------------------------------------------
   attempts, visited and confidence are the ORIGINAL fields — untouched,
   so progress saved by earlier versions of ChemDash keeps working exactly
   as before (coverage and per-standard confidence survive this upgrade).
   practiced / mastered / subtopicConfidence / review are NEW and simply
   default to empty when absent from an older saved record.
     attempts            : {itemId: {tries, correct}}      (legacy + still used)
     visited             : {"standard:subtopic": true}     (legacy — coverage)
     confidence          : {standardId: 1-4}                (legacy — per-standard)
     practiced           : {itemId: true}                   (NEW — "attempted")
     mastered            : {itemId: true}                   (NEW — "succeeded independently")
     subtopicConfidence  : {"standard:subtopic": "confident"|"practice"|"unknown"}
     review              : {"standard:stage:index": true}   (NEW — persisted checkboxes)
   --------------------------------------------------------------------- */
function loadProgress(){
  try{
    const p=JSON.parse(localStorage.getItem("chemdash_excellence_progress")||"{}");
    return {
      attempts:p.attempts||{}, visited:p.visited||{}, confidence:p.confidence||{},
      practiced:p.practiced||{}, mastered:p.mastered||{},
      subtopicConfidence:p.subtopicConfidence||{}, review:p.review||{},
      lastActivity:p.lastActivity||null
    };
  }catch(e){return {attempts:{},visited:{},confidence:{},practiced:{},mastered:{},subtopicConfidence:{},review:{},lastActivity:null}}
}
function saveProgress(){
  try{localStorage.setItem("chemdash_excellence_progress",JSON.stringify(progress))}catch(e){}
}
function visit(key){
  progress.visited[key]=true; saveProgress();
}
function markPracticed(id){ if(!id) return; progress.practiced[id]=true; saveProgress(); }
function markMastered(id,ev){ if(ev) ev.stopPropagation(); if(!id) return; progress.practiced[id]=true; progress.mastered[id]=true; saveProgress(); render(); }
function recordResult(id,correct){
  if(!id) return;
  const r=progress.attempts[id]||{tries:0,correct:0};
  r.tries++; if(correct) r.correct++;
  progress.attempts[id]=r;
  progress.practiced[id]=true;
  if(correct) progress.mastered[id]=true; // auto-graded types only (MCQ / match / build): first independent success = mastery signal
  saveProgress();
}
function standardCoverage(id){
  const topics=(topicMap[id]||[]).flatMap(t=>t.subtopics.map(s=>id+":"+s[0]));
  if(!topics.length) return 0;
  const seen=topics.filter(k=>progress.visited[k]).length;
  return Math.round(seen/topics.length*100);
}
function confidenceLabel(id){
  const v=progress.confidence[id]||0;
  return ["Not set yet","Starting out","Developing","Secure","Exam ready"][v]||"Not set yet";
}
function setConfidence(id,v,ev){
  if(ev) ev.stopPropagation();
  progress.confidence[id]=v; saveProgress(); render();
}
function accuracyStats(standardId){
  let tries=0,correct=0;
  allTaggedItems(standardId).forEach(it=>{
    const r=progress.attempts[it.id];
    if(r){tries+=r.tries;correct+=r.correct}
  });
  return {tries,correct,pct: tries? Math.round(correct/tries*100) : null};
}
/* Every tagged (id-bearing) item across recognise/build/explain/apply/worked,
   optionally scoped to one standard. Used for accuracy stats, mastery and
   the "needs work" / "strong areas" dashboard summary. */
function allTaggedItems(standardId){
  const ids = standardId ? [standardId] : Object.keys(standards);
  const out = [];
  ids.forEach(sid=>{
    const s = standards[sid];
    ["recognise","build","explain","apply","worked"].forEach(act=>{
      (s[act]||[]).forEach(it=>out.push(it));
    });
  });
  return out;
}
/* ---- Coverage vs Practice vs Mastery, per sub-topic --------------------
   Coverage : has the student opened this sub-topic at all?
   Practice : how many of its tagged items have they attempted, and how
              accurately (recorded in progress.attempts)?
   Mastery  : of its Explain / Apply / Exam items specifically, how many
              has the student succeeded at *independently* (never counting
              a Show Answer / Reveal click as success)?
   --------------------------------------------------------------------- */
function subtopicStats(standardId, subtopicId){
  const items = allTaggedItems(standardId).filter(it=>it.subtopic===subtopicId);
  let tries=0,correct=0,practiced=0,masteryEligible=0,mastered=0;
  items.forEach(it=>{
    const r=progress.attempts[it.id];
    if(r){tries+=r.tries;correct+=r.correct}
    if(progress.practiced[it.id]) practiced++;
    if(["explain","apply","worked"].includes(it_activity(standardId,it))){
      masteryEligible++;
      if(progress.mastered[it.id]) mastered++;
    }
  });
  function it_activity(sid,item){
    const s=standards[sid];
    for(const act of ["recognise","build","explain","apply","worked"]) if((s[act]||[]).includes(item)) return act;
    return null;
  }
  const visited = !!progress.visited[standardId+":"+subtopicId];
  const conf = progress.subtopicConfidence[standardId+":"+subtopicId] || null;
  return {
    total: items.length,
    covered: visited,
    practicedCount: practiced,
    accuracyPct: tries? Math.round(correct/tries*100) : null,
    masteryPct: masteryEligible? Math.round(mastered/masteryEligible*100) : null,
    confidence: conf
  };
}
function setSubtopicConfidence(standardId, subtopicId, value, ev){
  if(ev) ev.stopPropagation();
  progress.subtopicConfidence[standardId+":"+subtopicId]=value;
  saveProgress(); render();
}
/* Weakest sub-topics with real practice data behind them, for the
   dashboard's "Needs attention" list. Falls back to nothing rather than
   guessing when there isn't enough data yet. */
function weakSubtopics(limit){
  const rows=[];
  Object.keys(topicMap).forEach(sid=>{
    (topicMap[sid]||[]).forEach(t=>{
      t.subtopics.forEach(st=>{
        const stat=subtopicStats(sid, st[0]);
        if(stat.practicedCount>0 || stat.accuracyPct!==null){
          rows.push({standard:sid, topic:t.id, topicTitle:t.title, subtopic:st[0], subTitle:st[1], ...stat});
        }
      });
    });
  });
  return rows
    .filter(r=>r.accuracyPct!==null && r.accuracyPct<75)
    .sort((a,b)=>(a.accuracyPct??100)-(b.accuracyPct??100))
    .slice(0,limit||4);
}
function strongSubtopics(limit){
  const rows=[];
  Object.keys(topicMap).forEach(sid=>{
    (topicMap[sid]||[]).forEach(t=>{
      t.subtopics.forEach(st=>{
        const stat=subtopicStats(sid, st[0]);
        if(stat.accuracyPct!==null) rows.push({standard:sid, subTitle:st[1], ...stat});
      });
    });
  });
  return rows.filter(r=>r.accuracyPct>=75).sort((a,b)=>b.accuracyPct-a.accuracyPct).slice(0,limit||3);
}
function resetProgress(){
  if(!confirm("Clear all saved progress, confidence ratings and quiz history on this device? This cannot be undone.")) return;
  progress={attempts:{},visited:{},confidence:{},practiced:{},mastered:{},subtopicConfidence:{},review:{},lastActivity:null};
  saveProgress(); render();
}

/* ---- Sub-topic-aware question pools -------------------------------------
   When a student has drilled down to Standard -> Topic -> Sub-topic and
   picked an activity, every question shown must actually belong to that
   sub-topic (this was the site's biggest gap — see project notes). The
   guided pathway (no sub-topic chosen) keeps drawing from the whole
   standard, exactly as before. Falls back to the whole standard only if a
   sub-topic genuinely has no tagged items yet for that activity. */
let activePool=null, activePoolKey=null;
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function poolKey(activity){ return state.standard+":"+(state.topic||"_")+":"+(state.subtopic||"_")+":"+activity; }
function getPool(s, activity){
  const all = s[activity]||[];
  const key = poolKey(activity);
  if(state.topic && state.subtopic){
    const filtered = all.filter(it=>it.topic===state.topic && it.subtopic===state.subtopic);
    if(filtered.length){
      if(activePoolKey!==key){ activePool=shuffle(filtered); activePoolKey=key; }
      return activePool;
    }
  }
  if(activePoolKey!==key){ activePool=all; activePoolKey=key; }
  return activePool;
}
function currentPool(activity){ return getPool(current(), activity); }

/* Theme: follows the system by default; the toggle cycles
   system -> dark -> light -> system, remembered on this device only. */
function syncTheme(){
  let t=null;
  try{ t=localStorage.getItem("chemdash_theme"); }catch(e){}
  if(t) document.documentElement.setAttribute("data-theme", t);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : (cur==="light" ? null : "dark");
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("chemdash_theme", next||""); }catch(e){}
}

function buildSearchIndex(){
  const rows=[];
  Object.values(standards).forEach(s=>{
    (topicMap[s.id]||[]).forEach(t=>{
      t.subtopics.forEach(sub=>{
        rows.push({standard:s.id,standardTitle:s.title,colour:s.colour,topic:t.id,topicTitle:t.title,sub:sub[0],subTitle:sub[1],kind:"topic"});
      });
    });
    (glossary[s.id]||[]).forEach(([term,def])=>{
      rows.push({standard:s.id,standardTitle:s.title,colour:s.colour,term,def,kind:"glossary"});
    });
  });
  return rows;
}
let searchIndexCache=null; // built lazily on first open, see openSearch()

function openSearch(){
  if(!searchIndexCache) searchIndexCache=buildSearchIndex();
  const wrap=document.createElement("div");
  wrap.id="searchOverlay";

  wrap.onclick=e=>{if(e.target===wrap) closeSearch()};

  if(!q){box.innerHTML=`<div class="text-sm p-4" style="color:var(--muted)">Start typing — for example "buffer", "hydrogen bond" or "isomer".</div>`;return}
  const hits=searchIndexCache.filter(r=>{

}

function stableOptionOrder(prompt, count){
  // Deterministic shuffle so options stay put while a question is on screen,
  // but different questions distribute the correct answer across A/B/C/D.
  let seed = 0;
  for(let i=0;i<prompt.length;i++) seed = (seed * 31 + prompt.charCodeAt(i)) >>> 0;
  const arr = Array.from({length:count},(_,i)=>i);
  for(let i=count-1;i>0;i--){
    seed = (1664525 * seed + 1013904223) >>> 0;
    const j = seed % (i+1);
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
