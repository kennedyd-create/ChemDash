 const scopedButEmpty = scoped && actForEmptyCheck
   && !(s[actForEmptyCheck]||[]).some(it=>it.topic===state.topic&&it.subtopic===state.subtopic);

 const crumb = scoped
   ? `<div class="breadcrumb mb-4"><button onclick="goHome()">Home</button><span>›</span><button onclick="openHub('${s.id}','topics')">AS ${s.id}</button><span>›</span><button onclick="state.view='hub';state.hubTab='topics';state.subtopic=null;render();window.scrollTo(0,0)">${activeTopic.title}</button><span>›</span><span style="color:var(--ink);font-weight:700">${activeSub[1]}</span></div>`
   : `<div class="breadcrumb mb-4"><button onclick="goHome()">Home</button><span>›</span><button onclick="openHub('${s.id}','topics')">AS ${s.id}</button><span>›</span><span style="color:var(--ink);font-weight:700">Guided pathway</span></div>`;

 return `
 ${crumb}
 <section class="surface-strong p-7 spine" style="--spine:var(--c-${s.colour})">
   <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-5">
     <div><div class="kicker text-${s.colour}-700">AS ${s.id}${scoped?` — ${activeSub[1]}`:` — ${sc.credits} credits`}</div><h1 class="text-3xl font-bold mt-1">${scoped?activeSub[1]:s.title}</h1><p class="mt-2 max-w-3xl" style="color:var(--muted)">${scoped?`Only questions tagged to this exact sub-topic are shown.`:s.summary}</p></div>
     <div class="flex gap-2"><button onclick="openHub('${s.id}','topics')" class="btn-outline px-4 py-2.5 text-sm">Browse topics</button><button onclick="openHub('${s.id}','practice')" class="btn-ink px-4 py-2.5 text-sm">Practice</button></div>
   </div>
   ${scoped?`<div class="mt-5 p-4 rounded-lg text-sm flex flex-wrap items-center justify-between gap-3" style="background:var(--surface-2);color:var(--ink-soft)"><span><b>Scoped to:</b> ${activeTopic.title} → ${activeSub[1]}</span><button onclick="openStandard('${s.id}','${state.stage}')" class="text-sm font-bold" style="color:var(--ink)">Show the whole standard instead →</button></div>`
     :`<div class="mt-5 p-4 rounded-lg bg-${s.colour}-50 border border-${s.colour}-100 text-sm" style="color:var(--ink-soft)"><b>2026 scope:</b> ${sc.note}</div>`}
 </section>

 <div class="mt-5 surface p-3 overflow-x-auto"><div class="flex min-w-max gap-2">
   ${stageMeta.map(x=>`<button onclick="setStage('${x[0]}')" class="px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2" style="${state.stage===x[0]?"background:var(--brand-navy);color:#fff":"color:var(--muted)"}">${icon(x[2],15)} ${x[1]}</button>`).join("")}
 </div></div>

 <div class="mt-4 surface p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
   <div><div class="kicker" style="color:var(--muted)">Scaffolding</div><div class="text-sm" style="color:var(--ink-soft)">Reduce support as confidence grows.</div></div>
   <div class="flex flex-wrap gap-2">${["guided","supported","independent","exam"].map(m=>`<button onclick="setScaffold('${m}')" class="px-3 py-2 rounded-md text-xs font-bold uppercase tracking-wide" style="${state.scaffold===m?"background:var(--brand-navy);color:#fff":"background:var(--surface-2);color:var(--ink-soft)"}">${m}</button>`).join("")}</div>
 </div>

 <div class="mt-6">${scopedButEmpty && state.stage!=="learn" && state.stage!=="review" ? emptyPoolNotice(s) : renderStage(s)}</div>`;
}

function emptyPoolNotice(s){
  return `<div class="surface p-6 text-sm" style="color:var(--muted)">This exact sub-topic doesn't have tagged questions for this activity yet — showing the whole standard's bank instead so you still have something to practise with.<div class="mt-3"><button onclick="openStandard('${s.id}','${state.stage}')" class="btn-ink px-4 py-2 text-sm">Use whole-standard practice</button></div></div>`;
}

function renderStage(s){
 if(state.stage==="learn") return learnStage(s);
 if(state.stage==="recognise") return activityCarousel(currentPool("recognise"),"recognise");
 if(state.stage==="build") return activityCarousel(currentPool("build").map(x=>({type:"gap",prompt:x.stem,options:x.options,answer:x.answer,why:x.why,id:x.id,topic:x.topic,subtopic:x.subtopic})),"build");
 if(state.stage==="explain") return explainStage(s);
 if(state.stage==="apply") return applyStage(s);
 if(state.stage==="exam") return examStage(s);
 return reviewStage(s);
}

function learnStage(s){
 const diagramMarkup = s.diagram==="thermo" ? thermoDiagram() : s.diagram==="titration" ? titrationDiagram() : "";
 const diagramCardIndex = s.diagram==="thermo" ? s.learn.length-1 : s.diagram==="titration" ? 2 : -1;
 return `<div class="grid md:grid-cols-2 gap-5">
 ${s.learn.map((b,i)=>`<section class="surface p-6">
   <div class="text-xs font-bold uppercase tracking-wider text-${s.colour}-700 kicker">Learn ${i+1}</div>
   <h2 class="text-xl font-bold mt-1">${b.title}</h2>
   <ul class="mt-4 space-y-3">${b.points.map(p=>`<li class="flex gap-2 text-sm" style="color:var(--ink-soft)"><span style="color:var(--muted);flex:none;margin-top:2px">${icon("checkcircle",15)}</span><span>${p}</span></li>`).join("")}</ul>
   ${i===diagramCardIndex?diagramMarkup:""}
   ${state.scaffold==="guided"?`<div class="mt-5 p-4 rounded-lg bg-${s.colour}-50 border border-${s.colour}-100 text-sm" style="color:var(--ink-soft)"><b>Guided study move:</b> Cover this card and explain each bullet aloud from memory.</div>`:""}
 </section>`).join("")}
 </div>
 <div class="mt-5 text-sm text-center"><button onclick="openFloat('data')" class="font-bold" style="color:var(--ink)">Open the ${s.id} data &amp; formulae sheet →</button></div>`;
}

function activityCarousel(items,label){
 if(!items.length) return `<div class="p-6 surface">More activities will be added here.</div>`;
 const q=items[state.itemIndex%items.length];
 if(q.type==="match") return matchCard(q,items.length,label);
 return choiceCard(q,items.length,label);
}

function choiceCard(q,total,label){
 const order = stableOptionOrder(q.prompt, q.options.length);
 const shown = order.map(originalIndex => ({text:q.options[originalIndex], originalIndex}));
 const correctDisplayIndex = shown.findIndex(item => item.originalIndex === q.answer);
 const fallbackKey = state.standard+":"+state.stage+":"+state.itemIndex;

 return `<section class="max-w-3xl mx-auto surface p-6 md:p-8">
   <div class="flex items-center justify-between"><span class="kicker text-${current().colour}-700">${label}</span><span class="text-xs font-mono-num" style="color:var(--muted)">${state.itemIndex%total+1} / ${total}</span></div>
   <h2 class="text-xl md:text-2xl font-bold mt-4">${q.prompt}</h2>
   <div class="mt-6 space-y-3">${shown.map((item,i)=>`<button class="choice w-full text-left p-4 rounded-xl" style="border:2px solid var(--line)" onclick="answerStageChoice(${i},${correctDisplayIndex},'${escapeJS(q.why)}',${total},'${q.id||fallbackKey}')"><span class="inline-flex w-7 h-7 rounded-md items-center justify-center text-xs font-bold mr-2" style="background:var(--surface-2)">${String.fromCharCode(65+i)}</span>${item.text}</button>`).join("")}</div>
   <div id="stage-feedback" class="mt-5"></div>
 </section>`;
}

function answerStageChoice(sel,ans,why,total,itemId){
 const btns=[...document.querySelectorAll(".choice")];
 btns.forEach((b,i)=>{b.disabled=true;if(i===ans)b.classList.add("correct");else if(i===sel)b.classList.add("wrong")});
 const ok=sel===ans;
 recordResult(itemId, ok);
 document.getElementById("stage-feedback").innerHTML=`<div class="p-4 rounded-xl" style="border:1px solid ${ok?"var(--good)":"var(--wine)"};background:${ok?"var(--good-soft)":"var(--wine-soft)"}"><b>${ok?"Correct":"Review this"}</b><div class="text-sm mt-2" style="color:var(--ink-soft)">${why}</div><button onclick="nextStageItem(${total})" class="mt-4 btn-ink px-4 py-2 text-sm">Next →</button></div>`;
}

function matchCard(q,total,label){
 const shuffled=[...q.pairs].sort(()=>Math.random()-.5);
 return `<section class="max-w-4xl mx-auto surface p-6">
   <div class="flex items-center justify-between"><span class="kicker text-${current().colour}-700">${label} — mix &amp; match</span><span class="text-xs font-mono-num" style="color:var(--muted)">${state.itemIndex%total+1} / ${total}</span></div>
   <h2 class="text-xl font-bold mt-3">${q.prompt}</h2>
   <div class="grid md:grid-cols-2 gap-6 mt-6">
     <div>${q.pairs.map((p,i)=>`<button onclick="selectMatch('L',${i})" id="L${i}" class="matchL w-full text-left p-3 rounded-lg mb-2" style="border:2px solid var(--line)">${p[0]}</button>`).join("")}</div>
     <div>${shuffled.map(p=>{let idx=q.pairs.findIndex(x=>x[1]===p[1]);return `<button onclick="selectMatch('R',${idx})" id="R${idx}" class="matchR w-full text-left p-3 rounded-lg mb-2" style="border:2px solid var(--line)">${p[1]}</button>`}).join("")}</div>
   </div><div id="match-feedback" class="mt-4 text-sm" style="color:var(--muted)">Select one item from each column.</div>
 </section>`;
}

function selectMatch(side,idx){
 matchState[side]=idx;
 document.querySelectorAll(side==="L"?".matchL":".matchR").forEach(x=>{x.style.borderColor="var(--line)";x.style.background="transparent"});
 const el=document.getElementById(side+idx);
 if(el){el.style.borderColor="var(--ink)";el.style.background="var(--surface-2)"}
 if(matchState.L!==null&&matchState.R!==null){
   const ok=matchState.L===matchState.R, f=document.getElementById("match-feedback");
   if(ok){
     matchState.done.push(matchState.L);
     ["L","R"].forEach(sd=>{let e=document.getElementById(sd+matchState.L);e.disabled=true;e.style.borderColor="var(--good)";e.style.background="var(--good-soft)"});
     f.innerHTML=`<span class="font-bold" style="color:var(--good)">Matched.</span> ${matchState.done.length} complete.`;
     const pool=currentPool("recognise");
     const total=pool.length;
     const q=pool[state.itemIndex%total];
     if(matchState.done.length===q.pairs.length){
       recordResult(q.id||(state.standard+":match:"+state.itemIndex), true);
       f.innerHTML+=`<br><button onclick="nextStageItem(${total})" class="mt-3 btn-ink px-4 py-2 text-sm">Next →</button>`;
     }
   } else f.innerHTML=`<span class="font-bold" style="color:var(--wine)">Not a match.</span> Try again.`;
   matchState.L=null;matchState.R=null;
 }
}

function nextStageItem(total){state.itemIndex=(state.itemIndex+1)%total;matchState={L:null,R:null,done:[]};render()}

function excellenceAnatomyPanel(){
 const rows=[
   ["Chemical principle","Which scientific idea actually applies here?","Hydrogen bonding requires H bonded directly to N, O or F."],
   ["Particle-level cause","What is happening at the particle / molecular / atomic / ionic level?","H is bonded directly to F in HF; F carries lone pairs that attract that H on a neighbouring molecule."],
   ["Relationship","How are the variables or properties connected?","Stronger intermolecular attraction means more energy is required to separate particles."],
   ["Comparison","What is stronger/weaker, greater/lower, faster/slower — where the question needs one?","Hydrogen bonding in HF is stronger than the dipole-dipole and dispersion forces in HCl."],
   ["Consequence","What actually results from the chemical cause?","More thermal energy is needed to separate HF molecules, so HF boils at a higher temperature."],
   ["Question link","How does this directly answer the question asked?","This is exactly why HF has the higher boiling point despite HCl's greater molar mass."]
 ];
 return `<div class="mt-3 text-sm space-y-3" style="color:var(--ink-soft)">
   <p>An Excellence answer is not "more words" — it is one connected chain: <b style="color:var(--ink)">cause → relationship → consequence</b>. Strong responses usually contain all six of these parts:</p>
   <div class="grid sm:grid-cols-2 gap-3 mt-2">
     ${rows.map(x=>`<div class="p-3 rounded-lg" style="background:var(--surface)"><div class="font-bold text-xs uppercase tracking-wide" style="color:var(--muted)">${x[0]}</div><div class="text-xs mt-1" style="color:var(--muted)">${x[1]}</div><div class="text-sm mt-2 italic">"${x[2]}"</div></div>`).join("")}
   </div>
   <p class="pt-1">Use this as a checklist for constructing <b style="color:var(--ink)">your own</b> reasoning — the aim is to learn to build an answer like this, not to memorise the model answers below.</p>
 </div>`;
}

function explainStage(s){
 const pool=currentPool("explain");
 if(!pool.length) return `<div class="p-6 surface">More activities will be added here.</div>`;
 const q=pool[state.itemIndex%pool.length];
 return `<section class="max-w-4xl mx-auto surface p-6 md:p-8">
   <div class="kicker text-amber-700">Explain — Merit → Excellence</div>
   <h2 class="text-2xl font-bold mt-3">${q.question}</h2>
   ${state.scaffold==="guided"?`<div class="mt-5 p-4 rounded-lg bg-amber-50 border border-amber-200"><b>Build your answer from:</b><ul class="mt-2 text-sm list-disc pl-5">${q.criteria.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}
   ${state.scaffold==="supported"?`<div class="mt-5 text-sm" style="color:var(--muted)"><b>Prompt:</b> What is the chemical cause, and what consequence follows from it?</div>`:""}
   <textarea id="written" class="answer-lines mt-5 w-full min-h-44 p-4 rounded-xl outline-none" style="border:2px solid var(--line)" placeholder="${state.scaffold==="exam"?"Write under exam conditions — no hints.":"Write your explanation here..."}"></textarea>
   <button onclick="showExplainFeedback('${q.id}')" class="mt-4 btn-ink px-5 py-3">Compare with Merit / Excellence models</button>
   <details class="mt-5 p-4 rounded-xl" style="background:var(--surface-2)"><summary class="font-bold cursor-pointer text-sm">How to read an Excellence answer</summary>${excellenceAnatomyPanel()}</details>
   <div id="written-feedback"></div>
 </section>`;
}

function showExplainFeedback(itemId){
 const pool=currentPool("explain");
 const q=pool.find(x=>x.id===itemId)||pool[state.itemIndex%pool.length];
 const txtEl=document.getElementById("written");
 if(!txtEl || !txtEl.value.trim()) return;
 markPracticed(q.id);
 const checklist=[
   "Did I identify the relevant chemical principle?",
   "Did I explain what is happening at particle / molecular / atomic / ionic level?",
   "Did I connect the cause to the observed result — a relationship, not just a list of facts?",
   "Did I make the comparison the question needs (stronger/weaker, higher/lower...), where relevant?",
   "Did I answer the specific question asked, rather than describing the topic in general?"
 ];
 const mastered = !!progress.mastered[q.id];
 document.getElementById("written-feedback").innerHTML=`
 <div class="mt-6 p-4 rounded-xl" style="background:var(--surface-2)">
   <div class="kicker" style="color:var(--muted)">Check your own explanation first</div>
   <div class="mt-3 space-y-2">${checklist.map(c=>`<label class="flex items-start gap-2 text-sm" style="color:var(--ink-soft)"><input type="checkbox" class="mt-1"><span>${c}</span></label>`).join("")}</div>
 </div>
 <div class="mt-4 grid md:grid-cols-2 gap-4">
   <div class="p-5 rounded-xl border border-amber-200 bg-amber-50"><div class="kicker text-amber-700">Merit model</div><p class="text-sm mt-2" style="color:var(--ink-soft)">${q.merit}</p></div>
   <div class="p-5 rounded-xl border border-purple-200 bg-purple-50"><div class="kicker text-purple-700">Excellence-targeted model</div><p class="text-sm mt-2" style="color:var(--ink-soft)">${q.excellence}</p>
     <div class="mt-3 pt-3 border-t border-purple-200 text-xs" style="color:var(--ink-soft)"><b>What makes this Excellence:</b> it names the chemical principle, explains the particle-level cause, states the relationship, makes the comparison the question needs, and finishes by linking straight back to the question asked.</div>
   </div>
 </div>
 <div class="mt-4 flex flex-wrap items-center gap-3">
   <button onclick="markMastered('${q.id}',event)" class="px-4 py-2 rounded-lg text-sm font-bold" style="background:${mastered?"var(--good)":"var(--surface-2)"};color:${mastered?"#fff":"var(--ink-soft)"}">${mastered?"✓ Marked as independent":"I could produce this independently"}</button>
   <span class="text-xs" style="color:var(--muted)">Self-assessed, for your own revision planning — not an official grade.</span>
 </div>
 <button onclick="nextStageItem(${pool.length})" class="mt-4 btn-ink px-4 py-2 text-sm">Next →</button>`;
}

function applyStage(s){
 const pool=currentPool("apply");
 if(!pool.length) return `<div class="p-6 surface">More activities will be added here.</div>`;
 const q=pool[state.itemIndex%pool.length];
 const mastered = !!progress.mastered[q.id];
 return `<section class="max-w-3xl mx-auto surface p-6 md:p-8">
 <div class="kicker text-indigo-700">Apply — transfer</div>
 <h2 class="text-2xl font-bold mt-3">${q.question}</h2>

 <textarea class="mt-5 w-full min-h-40 p-4 rounded-xl" style="border:2px solid var(--line)" placeholder="Try it before revealing the model..."></textarea>
 <details class="mt-5 p-5 rounded-xl" style="background:var(--surface-2)" ontoggle="if(this.open) markPracticed('${q.id}')">
   <summary class="font-bold cursor-pointer">Reveal model response</summary>

   <div class="mt-4"><button onclick="markMastered('${q.id}',event)" class="px-3 py-1.5 rounded-lg text-xs font-bold" style="background:${mastered?"var(--good)":"var(--surface)"};color:${mastered?"#fff":"var(--ink-soft)"}">${mastered?"✓ Answered independently before revealing":"I answered this correctly before revealing"}</button></div>
 </details>
 <button onclick="nextStageItem(${pool.length})" class="mt-5 btn-ink px-4 py-2 text-sm">Next transfer question →</button>
 </section>`;

function examStage(s){
 const pool=currentPool("worked");
 if(!pool.length) return `<div class="p-6 surface">More activities will be added here.</div>`;
 return `<div class="space-y-5">
 <section class="rounded-xl p-6" style="background:linear-gradient(135deg,var(--brand-navy) 0%,var(--brand-navy-deep) 100%);color:#fff"><div class="kicker" style="color:var(--gold)">Exam mode</div><h2 class="text-2xl font-bold mt-2">Remove the scaffolding</h2><p class="mt-2" style="color:rgba(255,255,255,.85)">Use the worked examples to learn the method, then attempt these independently before revealing anything.</p></section>
 ${pool.map((w,i)=>{const mastered=!!progress.mastered[w.id];return `<article class="surface p-6">

     <div class="p-4 rounded-lg bg-red-50 border border-red-200"><b>Common trap</b><p class="text-sm mt-2">${w.trap}</p></div>
   </div>
   <details class="mt-5 p-5 rounded-lg border border-purple-200 bg-purple-50" ontoggle="if(this.open) markPracticed('${w.id}')">

   </details>
 </article>`}).join("")}
 </div>`;

 <section class="surface p-6">

function hubExam(s){

  return `<section class="surface p-5 spine" style="--spine:var(--c-${s.colour})">
    <div class="kicker text-${s.colour}-700">AS ${s.id} — ${sc.credits} credits</div>
    <h2 class="font-bold text-lg mt-1">${sc.title}</h2>
    <ul class="scope-list mt-3 text-sm space-y-2" style="color:var(--ink-soft)">${sc.focus.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="mt-4 pt-4 hairline text-xs" style="color:var(--muted)"><b style="color:var(--ink-soft)">2026 scope note:</b> ${sc.note}</div>
    <div class="mt-3 text-xs" style="color:var(--muted)"><b style="color:var(--ink-soft)">Supplied:</b> ${sc.supplied}</div>
    <button onclick="openFloat('data')" class="mt-4 text-sm font-bold text-${s.colour}-700">Open data &amp; formulae sheet →</button>
  </section>
  <section class="mt-5 surface p-5">
    <div class="kicker text-amber-700">ChemDash exam routine</div>
    <div class="grid sm:grid-cols-4 gap-3 mt-4">
      ${["Identify the chemistry","Choose the evidence or formula","Show the relationship","Finish with the consequence"].map((x,i)=>`<div class="p-3 rounded-lg" style="background:var(--surface-2)"><div class="text-xs font-bold font-mono-num" style="color:var(--muted)">0${i+1}</div><div class="text-sm font-bold mt-1">${x}</div></div>`).join("")}
    </div>
  </section>
  <section class="mt-5 surface p-5">
    <div class="kicker" style="color:var(--muted)">General exam requirements</div>
    <ul class="scope-list mt-3 text-sm space-y-2" style="color:var(--ink-soft)">
      <li>All three standards are assessed by a printed end-of-year examination.</li>
      <li>An approved scientific or graphics calculator is required — all working must be shown.</li>
      <li>Give numeric answers to an appropriate number of significant figures and always include units.</li>
      <li>Use IUPAC naming conventions when naming organic compounds.</li>
    </ul>
  </section>`;
}

function hubGlossary(s){
  return `<section class="surface p-5 spine" style="--spine:var(--c-${s.colour})">
    <div class="kicker text-${s.colour}-700">AS ${s.id}</div>
    <h2 class="font-bold text-lg mt-1">${s.title} glossary</h2>
    <dl class="mt-4 space-y-3">${(glossary[s.id]||[]).map(([term,def])=>`<div><dt class="font-bold text-sm">${term}</dt><dd class="text-sm mt-0.5" style="color:var(--ink-soft)">${def}</dd></div>`).join("")}</dl>
  </section>`;
}

function hub(){
  const s=current(), sc=examScope[s.id], cov=standardCoverage(s.id);
  const tabs=[["topics","Browse topics"],["practice","Practice centre"],["exam","Exam scope & resources"],["glossary","Glossary"]];
  const body = state.hubTab==="practice" ? hubPractice(s)
    : state.hubTab==="exam" ? hubExam(s)
    : state.hubTab==="glossary" ? hubGlossary(s)
    : hubTopics(s);
  return `<button onclick="goHome()" class="text-sm font-bold mb-5 flex items-center gap-2" style="color:var(--muted)">${icon("back",16)} All standards</button>
  <section class="surface-strong p-6 md:p-7 spine" style="--spine:var(--c-${s.colour})">
    <div class="flex flex-col md:flex-row md:items-start justify-between gap-5">
      <div class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-lg bg-${s.colour}-50 text-${s.colour}-700 flex items-center justify-center flex-none">${icon(s.icon,22)}</div>
        <div>
          <div class="kicker text-${s.colour}-700">AS ${s.id} — ${sc.credits} credits</div>
          <h1 class="text-2xl md:text-3xl font-bold mt-1">${s.title}</h1>
          <p class="mt-2 max-w-2xl text-sm" style="color:var(--muted)">${s.summary}</p>
        </div>
      </div>
      <div class="md:w-44 flex-none">
        <div class="flex justify-between text-xs font-bold" style="color:var(--ink-soft)"><span>Visited</span><span class="font-mono-num">${cov}%</span></div>
        <div class="progress-track mt-2"><div class="progress-fill" style="width:${cov}%"></div></div>
      </div>
    </div>
    <div class="mt-5 flex flex-wrap gap-2">${tabs.map(t=>`<button onclick="setHubTab('${t[0]}')" class="tab-btn${state.hubTab===t[0]?" active":""}">${t[1]}</button>`).join("")}</div>
  </section>
  <div class="mt-5">${body}</div>`;
}

/* =========================================================================
   RENDER: FLOATING REFERENCE PANELS (data & formulae, periodic table)
   ========================================================================= */
function referenceData(){
  return Object.values(standards).map(s=>{
    const d=dataSheet[s.id];
    return `<section class="surface p-6 mb-5 spine" style="--spine:var(--c-${s.colour})">
      <div class="kicker text-${s.colour}-700">AS ${s.id} — ${s.title}</div>
      <div class="grid md:grid-cols-2 gap-3 mt-4">
        ${d.equations.map(([eq,note])=>`<div class="p-3 rounded-lg" style="background:var(--surface-2)"><div class="eq">${eq}</div><div class="text-xs mt-2" style="color:var(--muted)">${note}</div></div>`).join("")}
      </div>
      <div class="mt-6">
        <h3 class="font-bold">${d.reference.title}</h3>
        <div class="mt-3 overflow-x-auto"><table class="data-table"><thead><tr>${d.reference.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${d.reference.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      </div>
    </section>`;
  }).join("");
}

function referencePeriodic(){
  const sel = state.ptElement ? elements.find(e=>e.z===state.ptElement) : null;
  const cellFor = e=>{
    const isFRow = e.group===0;
    const row = isFRow ? (e.period===6?9:10) : e.period;
    const col = isFRow ? (e.z>=90 ? e.z-90+3 : e.z-58+3) : e.group;
    const active = state.ptElement===e.z ? " pt-active" : "";
    return `<button onclick="showElement(${e.z})" title="${e.name} (${e.mass})" class="pt-cell pt-${e.cat}${active}" style="grid-column:${col};grid-row:${row}">
      <span class="pt-z">${e.z}</span><span class="pt-sym">${e.sym}</span><span class="pt-mass">${e.mass}</span>
    </button>`;
  };
  const legend = Object.entries(CAT_LABEL).map(([k,label])=>`<div class="flex items-center gap-1.5 text-xs" style="color:var(--ink-soft)"><span class="pt-swatch pt-${k}"></span>${label}</div>`).join("");
  return `<section class="surface-strong p-6 md:p-7">
    <div class="kicker text-orange-700">Periodic table</div>
    <h1 class="text-2xl font-bold mt-1">All 118 elements, colour-coded by category</h1>
    <p class="mt-2 text-sm" style="color:var(--muted)">Tap or click an element for its full details. Lanthanides and actinides are shown in the two rows below the main table.</p>
    <div class="mt-4 flex flex-wrap gap-x-4 gap-y-2">${legend}</div>
  </section>

  <section class="mt-5 surface p-4 md:p-5">
    <div class="pt-scroll overflow-x-auto pb-2">
      <div class="pt-grid">${elements.map(cellFor).join("")}</div>
    </div>
  </section>

  ${sel ? `<section class="mt-5 surface-strong p-6 spine" style="--spine:${CAT_SPINE[sel.cat]||"var(--brand-navy)"}">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <div class="kicker" style="color:var(--muted)">${CAT_LABEL[sel.cat]} — Period ${sel.period}${sel.group?`, Group ${sel.group}`:""}</div>
        <h2 class="text-3xl font-bold mt-1">${sel.name}</h2>
      </div>
      <div class="text-right">
        <div class="font-mono-num font-bold" style="font-size:2.6rem;line-height:1;color:var(--ink)">${sel.sym}</div>
        <div class="font-mono-num text-sm mt-1" style="color:var(--muted)">Z = ${sel.z} · ${sel.mass}</div>
      </div>
    </div>
    <button onclick="showElement(${sel.z})" class="mt-4 text-sm font-bold" style="color:var(--muted)">Close ✕</button>
  </section>` : ""}

  <section class="mt-5 surface p-5">
    <div class="kicker text-amber-700">Reading the trends (AS 91390)</div>
    <div class="grid sm:grid-cols-2 gap-3 mt-3 text-sm" style="color:var(--ink-soft)">
      <div class="p-3 rounded-lg" style="background:var(--surface-2)"><b style="color:var(--ink)">Across a period (left → right):</b> atomic radius decreases, ionisation energy increases, electronegativity increases — effective nuclear charge is increasing while shielding stays roughly constant.</div>
      <div class="p-3 rounded-lg" style="background:var(--surface-2)"><b style="color:var(--ink)">Down a group (top → bottom):</b> atomic radius increases, ionisation energy decreases, electronegativity decreases — an extra occupied shell adds shielding faster than the nuclear charge pulls electrons in.</div>
    </div>
  </section>`;
}

function floatingWidget(){
  const menuOpen = state.floatOpen==="menu";
  const panelTab = (state.floatOpen==="data"||state.floatOpen==="periodic") ? state.floatOpen : null;
  return `
  ${menuOpen?`<div class="float-menu">
    <button onclick="openFloat('data')">${icon("filecheck",16)} Data &amp; formulae</button>
    <button onclick="openFloat('periodic')">${icon("hexagon",16)} Periodic table</button>
  </div>`:""}
  <button onclick="toggleFloatMenu()" class="float-btn" title="Data &amp; formulae / Periodic table">${icon(menuOpen?"close":"flask",22)}</button>
  ${panelTab?`<div class="overlay" id="floatOverlay" onclick="closeFloatIfBackdrop(event)">
    <div class="overlay-panel">
      <div class="p-4 border-b flex items-center justify-between" style="border-color:var(--line)">
        <div class="font-bold">${panelTab==="data"?"Data &amp; formulae":"Periodic table"}</div>
        <button onclick="closeFloat()" class="p-1.5 rounded-lg" style="color:var(--muted)">${icon("close",18)}</button>
      </div>
      <div class="p-4">${panelTab==="data"?referenceData():referencePeriodic()}</div>
    </div>
  </div>`:""}`;
}

/* =========================================================================
   ROOT RENDER
   ========================================================================= */
function render(){
 const main = state.view==="home" ? home()
   : state.view==="hub" ? hub()
   : standardPage();

 document.getElementById("app").innerHTML=`
 <header class="masthead sticky top-0 z-40">
   <div class="shell h-16 flex items-center justify-between">
     <button onclick="goHome()" class="flex items-center gap-3">
       <img src="${WHS_LOGO}" alt="Waiheke High School crest" class="whs-crest">
       <div class="text-left"><div class="font-bold text-lg leading-none" style="font-family:var(--font-display);color:#fff">ChemDash</div><div class="kicker mt-1">Waiheke High School</div></div>
     </button>
     <nav class="flex items-center gap-1">
       <a href="${STUDENT_NCEA_URL}" target="_blank" rel="noopener" title="Open the StudentNCEA hub in a new tab" class="nav-pill px-3 py-2 text-sm font-bold inline-flex items-center gap-1.5" style="color:#fff">StudentNCEA ${icon("externallink",13)}</a>
       <button onclick="openSearch()" title="Search topics and glossary" class="icon-btn p-2.5">${icon("search",16)}</button>
       <button onclick="toggleTheme()" id="theme-toggle-btn" title="Switch light / dark theme" class="icon-btn p-2.5">${icon("theme",16)}</button>
     </nav>
   </div>
 </header>
 <main class="shell py-7 md:py-9 pb-16">${main}</main>
 <footer class="shell pb-8"><div class="hairline pt-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs" style="color:var(--muted)">
   <span>ChemDash — NCEA Level 3 Chemistry — learn accurately, practise actively, explain deeply</span>
   <button onclick="resetProgress()" class="flex items-center gap-1.5 font-semibold" style="color:var(--muted)">${icon("refresh",13)} Reset saved progress</button>
 </div></footer>
 ${floatingWidget()}`;
}

syncTheme();
render();
</script>
</body>
</html>
